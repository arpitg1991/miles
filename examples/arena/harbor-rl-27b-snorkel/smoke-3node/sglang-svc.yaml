# SGLang router service (router runs on the Ray head, replica-index 0).
apiVersion: v1
kind: Service
metadata:
  name: rl-milesgb1-sglang
  namespace: arena-tasks
  labels:
    app: rl-snork27b
spec:
  type: ClusterIP
  selector:
    training.kubeflow.org/job-name: rl-milesgb1-trainer
    training.kubeflow.org/replica-index: "0"
  ports:
  - name: http
    port: 30000
    targetPort: 30000
