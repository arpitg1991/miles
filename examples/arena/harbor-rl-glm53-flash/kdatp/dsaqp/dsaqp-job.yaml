# kdatp-dsaqp: the 1-node parity and timing test of --glm5-next-dsa-qp (dsaqp-run.sh, ../dsa/t1_dsa_qp.py).
# Placeholders: __IMAGE__ (a trainer image with the query-parallel DSA code and the FlashMLA wheel),
# __STAMP__ (a fresh lowercase suffix; it names the job, the run dir and the harness dir on the scratch mount).
# ../dsa/dsa-job.yaml with the driver on the mount and a 4,200 s deadline; same queue, priorities, node
# exclusions, tolerations, volumes and resources. No NATS, gym, W&B key or checkpoint.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: kdatp-dsaqp-__STAMP__
  namespace: arena-tasks
  labels:
    app: kdatp-dsaqp-__STAMP__
    arena.agif.amazon.dev/submitter: acuadron
    kueue.x-k8s.io/queue-name: gpu.p6-b200-48xlarge
    kueue.x-k8s.io/priority-class: inference
spec:
  elasticPolicy:
    minReplicas: 1
    maxReplicas: 1
    maxRestarts: 0
    nProcPerNode: 8
    rdzvBackend: c10d
    rdzvId: kdatp-dsaqp-__STAMP__
  runPolicy:
    # Delete the job by hand when it ends (README.md); the results are on the scratch mount.
    activeDeadlineSeconds: 4200
    # The default (None) keeps running pods after a deadline or a failed replica, so they keep the GPUs.
    cleanPodPolicy: All
  pytorchReplicaSpecs:
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: kdatp-dsaqp-__STAMP__
            arena.agif.amazon.dev/submitter: acuadron
            kueue.x-k8s.io/queue-name: gpu.p6-b200-48xlarge
          annotations:
            karpenter.sh/do-not-disrupt: "true"
        spec:
          serviceAccountName: arena-tasks-runner
          enableServiceLinks: false
          priorityClassName: high
          nodeSelector:
            node-type: p6-gpu
            node.kubernetes.io/instance-type: p6-b200.48xlarge
          # The excluded-nodes list of r44, r45 and r46 on 2026-09-27 (83 nodes, the same in all three).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - i-0095c4bdd6e83746c
                    - i-009d7ccb2747b5877
                    - i-00ad008f9bd0b1a13
                    - i-00ae4cb06b320f7c6
                    - i-00d697955a3668258
                    - i-0383f4de8d96aa77d
                    - i-03f00447f52586416
                    - i-0412fc9a03d9ea0ce
                    - i-044280557445205fa
                    - i-046109f4986c0e4df
                    - i-0483c03e7cd0165ee
