          tolerations:
          - {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
          - {effect: NoSchedule, key: vpc.amazonaws.com/efa, operator: Exists}
          containers:
          - name: pytorch
            image: __IMAGE__
            imagePullPolicy: Always
            command: [bash, -c]
            # The desktop uploads the harness files to S3; the mount imports them within minutes.
            # The driver waits for the other files it needs.
            args:
            - |
              S=/mnt/scratch-s3files-rw/acuadron/kdatp/dsaqp/__STAMP__/harness/dsaqp-run.sh
              for i in $(seq 120); do [ -f "$S" ] && break; echo "[dsaqp] waiting for $S"; sleep 5; done
              exec bash "$S"
            env:
            - {name: DSAQP_STAMP, value: __STAMP__}
            - {name: USER, value: acuadron}
            - {name: AGISLIME_DIR, value: /root/miles}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: PYTHONFAULTHANDLER, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: LD_LIBRARY_PATH, value: "/opt/amazon/ofi-nccl/lib:/opt/amazon/efa/lib:/usr/local/cuda/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"}
            - {name: FI_EFA_USE_DEVICE_RDMA, value: "1"}
            - {name: FI_PROVIDER, value: efa}
            - {name: FI_EFA_FORK_SAFE, value: "1"}
            - {name: NCCL_TIMEOUT, value: "7200"}
            - {name: NCCL_SOCKET_IFNAME, value: eth0}
            - {name: GLOO_SOCKET_IFNAME, value: eth0}
            - {name: NCCL_PROTO, value: simple}
            - {name: NCCL_IB_DISABLE, value: "0"}
            - {name: NCCL_NET_GDR_LEVEL, value: "2"}
            - {name: NCCL_P2P_DISABLE, value: "0"}
            - {name: RAY_memory_monitor_refresh_ms, value: "0"}
            - {name: TORCHINDUCTOR_COMPILE_THREADS, value: "1"}
            - name: REPLICA_IDX
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['training.kubeflow.org/replica-index']"}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            resources:
              limits: {memory: 1800Gi, nvidia.com/gpu: "8", vpc.amazonaws.com/efa: "8"}
              requests: {ephemeral-storage: 32Gi, memory: 1200Gi, nvidia.com/gpu: "8", vpc.amazonaws.com/efa: "8"}
            securityContext: {privileged: true}
            volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
            - {name: infiniband, mountPath: /dev/infiniband}
            - {name: nvidia-caps, mountPath: /dev/nvidia-caps}
          volumes:
          - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 256Gi}}
          - {name: infiniband, hostPath: {path: /dev/infiniband}}
          - {name: nvidia-caps, hostPath: {path: /dev/nvidia-caps}}
