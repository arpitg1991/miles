# kdatp-prof-<stamp>: train-only T2 timing of --glm5-next-dsa-qp on the ns stack (image miles-glm53-qp-20261006a).
# Replayed T2 rows (r45 sample summary rollout 43 + r43 token files), DP 2, 4 rollouts per arm: step 0 cold, 3 timed.
# Dataset of record, NOT used here: lakefs://arena-inspect/main/internal/agentic-debt-r3/agentic-debt-766/.
# Every arm is the ns layout: TP8 SP, PP4 11/11/11/12, EP8, FlashMLA forward. The same-job control is the flag off.
# Routing replay is OFF in every arm: the T2 rows of 2026-09-29 carry the routing payload of the old data path, and the
# ns image's R3 fill reads 252 bytes of it; job 20261006q hung in the first train step of the control arm for 70 min
# with R3 on (no error, no step). The 30 Sep and 03 Oct numbers ran with R3 on, so cross-date comparisons carry that.
# Reference: 20260930f ep8 (FlashMLA + EP8, the earlier kernel port) 470.7 s; acuadron 20261003q qp-ep8 259.5 s, qp-ep8-pp12 242.0 s.
- name: control        # the ns path: flag off, EP8, FlashMLA forward (the live r54-ns / r56-ns trainer)
  profile: false
  data: {groups: "243,284,307,258,239,306,276,309", dp_size: 2, dir: t2, replay_rollout: 40}
  timeout: 3000
  set: {use_rollout_routing_replay: false, expert_model_parallel_size: 8, miles_dsa_sparse_attention_forward_backend: flash_mla}
- name: qp             # plus the query-parallel core (the v19 arm)
