  set: {use_rollout_routing_replay: false, expert_model_parallel_size: 8, miles_dsa_sparse_attention_forward_backend: flash_mla, glm5_next_dsa_qp: true, miles_dsa_topk_backend: flashinfer}
- name: qp-split       # qp plus the 12/11/11/11 stage split (acuadron qp-ep8-pp12)
