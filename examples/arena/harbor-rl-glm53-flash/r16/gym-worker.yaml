# rl-glm53f16 gym workers: run5-proven smoke asset renamed (rl-milesgb1 -> rl-glm53f16),
# replicas 8 -> 128 (r5 fleet size for rbs 32), ARENA_MODEL_PATH -> GLM-5.3-Flash-BF16
# on fast scratch (workers tokenize against the policy model).
#
# r16 deltas vs r15 (2026-09-09): R3 rollout routing replay (miles arena
# ADR-0012, AREnATasks ADR-0049).
#   - image: TODO(orchestrator) a gym image with G1 (per-segment routing
#     snapshot), G2 (prepare_routed_experts_for_transport in the Harbor
#     worker) and G3 (ARENA_ROUTING_DIR). Replace the tag below.
#   - env ARENA_ROUTING_DIR: TODO(orchestrator) set the identical value to
#     r16/trainer-pytorchjob.yaml once the shared mount is confirmed (see the
#     TODO there). Left unset here on purpose: with the env set and no shared
#     mount the producer writes to a pod-local directory and every trainable
#     sample fails on the trainer with RoutingReplayError.
#   - The trainer sets capture_routed_experts on every task message; the gym
#     already honors it (amzn_arena_contract.rl.messages).
#   - Everything else is r15.
#
# r12 deltas vs r11 (2026-09-08):
#   - image: gym-glm53-vulcan-20260908a (AREnATasks arpit-glm-53 a337c2d,
#     `brazil-build docker-arena`, pushed to us-east-1 arena-slime-dev,
#     replicated to ap-south-1; r13/BUILD.md).
#   - --agent arena-terminus-2 -> --agent vulcan: the Vulcan agent with
#     token-aware context compaction (AREnATasks ADR-0048). The policy writes
#     a handoff note (pi prompts) before each compaction. The compacted
#     history is text only ([system, instruction, bridge]);
#     compaction_tail_fraction defaults to 0 and arena-sglang rejects a
#     non-zero tail. Each compaction starts a new rollout segment in
#     rollout.json, and the gym ships one step per segment.
#   - env ARENA_COMPACTION_MAX="2" (default 4): keeps one NATS result message
#     under the broker's 8 MiB max_payload. Other ARENA_COMPACTION_* knobs
#     keep their defaults (FRACTION 0.8, SUMMARY 1, TRAIN_SUMMARY 1,
#     TAIL_FRACTION 0).
#   - env ARENA_CONTEXT_NUDGE_TOKENS removed: that is the arena-terminus-2
#     nudge and Vulcan does not read it. Vulcan has its own wrap-up prompts
#     at 0.8 and 0.9 of the window.
#   - Vulcan reads ARENA_MAX_TOKENS (max_tokens), ARENA_ROLLOUT_CONTEXT_LIMIT
#     (context_limit), ARENA_REASONING_EFFORT (reasoning_effort),
#     ARENA_AGENT_TIMEOUT_MULTIPLIER, ARENA_SGLANG_REQUEST_TIMEOUT_SEC and
#     ARENA_MODEL_PATH. All of them keep their r11 values.
#   - Trainer side: arena_train_segments: all (r16/miles-config.yaml) trains
#     every segment; image miles-glm53-20260908a (r13/trainer-pytorchjob.yaml).
#   - Everything else is r11: replicas 288, ack wait, timeouts, node affinity.
#
# Deltas vs run 1: 96 replicas (up from 64) — run 2 enables the dynamic
# sampling filter (zero-variance groups dropped, extras fetched), which
# consumes up to 4x GBS groups per step; more workers keep rollout wall
# time down so off-policy drift does not grow.
# Deltas vs bom-27b-run2 (financeagent):
#   - gym snorkel-general-bash-harbor; reward = the binary in-container
#     pytest verifier (reward.txt) ONLY (option A). The Inspect seam's
#     gpt-oss rubric leg is not in this loop, so no judge env is wired;
#     worker-side rubric grading (option C) is the planned follow-up.
#   - Tasks materialize per-task from lakeFS at the pinned commit
#     (resolve_task_dir fallback) — no ARENA_DATASET_ROOT staging of the
#     212k-object payload. Cache lives on the /trials volume.
#   - Task images are prebuilt digest-pinned ECR refs
#     (arena/snorkel-generic-bash-3k, us-west-2 replica): the entry script
#     logs the dind daemon into ECR and refreshes the token every 6 h.
#   - allow_internet=false on every task -> harbor builds its egress-control
#     sidecar via `docker buildx`, but the worker image ships no buildx
#     plugin (financeagent never hit this path). The entry script installs
#     the pinned buildx binary before starting the worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-glm53f16-gym-sgb
  namespace: arena-tasks
  labels:
    app: rl-glm53f16-gym-worker
    arena.gym: snorkel-general-bash-harbor
spec:
  # r11: 160 -> 288. Publisher in-flight cap is now arena_inflight_multiplier
  # (4) x rollout_batch_size (64) = 256 groups; +slack (r6-r10: 2 x 64 = 128 -> 160).
  replicas: 288
  selector:
    matchLabels:
      app: rl-glm53f16-gym-worker
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: rl-glm53f16-gym-worker
        arena.gym: snorkel-general-bash-harbor
    spec:
      serviceAccountName: arena-tasks-runner
      enableServiceLinks: false
      # Keep gym + dind pods OFF the GPU nodes: p6-b200 nodes are NOT tainted
      # (1258 default-toleration pods sat on them in the 2026-09-03 snapshot) and
      # the trainer requests 1200Gi / 0 CPU, leaving ~746 GiB and ~190 vCPU per
      # engine node for anything kube-scheduler spreads there; run 2's 128 gym
      # pods (48Gi req / 96Gi lim) had no placement constraint. Keys verified
      # from live GPU pod specs (trainer-pytorchjob.yaml:66-68). NotIn needs
      # updating for new GPU instance types. This only repels OUR pods; other
      # submitters' pods need a platform taint (nvidia.com/gpu:NoSchedule --
      # every GPU pod already tolerates it, trainer-pytorchjob.yaml:100-106).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                - p6-b200.48xlarge
              - key: node-type
                operator: NotIn
                values:
                - p6-gpu
      containers:
      - name: gym-worker
        # r5 (2026-09-03): AREnATasks HEAD 35f7ba7 + the ARENA_REASONING_EFFORT
        # plumbing (ArenaSGLangLLM renders the chat template's reasoning_effort
        # on the first turn; fails the trial loudly if the template ignores it).
        # Built with `brazil-build docker-push-arena glm53-reasoning-20260903b`
        # (pushed to us-east-1, replicated to ap-south-1). Also fixes the
        # pre-existing splice bug that doubled GLM's <|user|> at every turn
        # boundary in r1-r4 token streams (model stop token + template opener).
        # Ships harbor 0.22.0
        # (was 0.21.0 in rl-smoke-20260821b) and the HEAD gym CLI contract:
        # --mode is required and the default agent is now Vulcan. r5-r11
        # pinned --mode rollout --agent arena-terminus-2 (parity with the
        # r1-r4 Terminus-2 rollouts); r12 pins --agent vulcan (see the r12
        # header block).
        # r6 (2026-09-04): rebased on AREnATasks mainline c1a0439 (ARENA_AGENT_TIMEOUT_MULTIPLIER
        # in the eval path) + a one-line fix passing the multiplier on the training
        # path too (mainline only wired eval). Same reasoning-effort + splice fix as r5.
        # r8 (2026-09-05): AREnATasks guparpit/reasoning-effort + "context
        # overflow ends the episode": ArenaTerminus2 catches
        # ContextLengthExceededError, stamps agent_stop_reason=context_error
        # into rollout.json and returns, so the verifier grades the work done
        # so far and the trainer keeps it as TRUNCATED (was: trial failed,
        # verifier skipped, trainer padded a failed= slot; r6 2945 / r7 711
        # such episodes lost). TO BUILD before launch.
        # r11 (2026-09-07): moved to arena-slime-dev. arena-tasks-dev keeps only the
        # 50 most recent images (shared repo, dozens of task-image pushes/day), so
        # our gym + preseed images were pruned within hours -- twice today.
        # r11 ran gym-glm53-ctxnudge-20260906a (arena-terminus-2 + budget nudge).
        # r12 (2026-09-08): AREnATasks arpit-glm-53 a337c2d, `brazil-build
        # docker-arena`, tagged and pushed to us-east-1 arena-slime-dev
        # (replicates to ap-south-1). Vulcan agent with token-aware context
        # compaction (ADR-0048); see the r12 header block and r13/BUILD.md.
        image: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:gym-glm53-vulcan-glm47-20260908b
        command: ["bash", "-c"]
        args:
        - |
          set -uo pipefail
          # harbor 0.17.1 builds the egress-control sidecar (allow_internet=false)
          # with `docker buildx build`; install the pinned plugin (verified sha).
          BUILDX_URL=https://github.com/docker/buildx/releases/download/v0.30.1/buildx-v0.30.1.linux-amd64
          BUILDX_SHA=c37114fcd034025ec68e224657c8a5a850df472ded3ddcbca75ad3a7ebb9710d
          mkdir -p /usr/local/lib/docker/cli-plugins
          until curl -sfL --max-time 120 "$BUILDX_URL" -o /usr/local/lib/docker/cli-plugins/docker-buildx \
                && echo "$BUILDX_SHA  /usr/local/lib/docker/cli-plugins/docker-buildx" | sha256sum -c -; do
            echo "buildx download retry"; sleep 10
          done
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker buildx version
          ecr_login() {
            aws ecr get-login-password --region us-west-2 \
              | docker login --username AWS --password-stdin 427267593057.dkr.ecr.us-west-2.amazonaws.com
          }
          # r10: probe + egress-sidecar preseed images were pruned from the
          # us-west-2 arena-tasks-dev repo; they survive in ap-south-1 (the
          # cluster region). Pull them from ap-south-1. Task images stay on
          # us-west-2 (still present). The ecr-dev role cannot push to
          # us-west-2 (replication-only), so a cross-region restore is blocked.
          ecr_login_aps() {
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin 427267593057.dkr.ecr.ap-south-1.amazonaws.com
          }
          until docker info >/dev/null 2>&1; do echo "waiting for dind"; sleep 2; done
          until ecr_login; do echo "ecr login retry"; sleep 10; done
          ( while sleep 21600; do ecr_login || true; done ) &
          until ecr_login_aps; do echo "ecr aps login retry"; sleep 10; done
          ( while sleep 21600; do ecr_login_aps || true; done ) &
          # Pre-seed harbor's egress-control kernel-probe image. Harbor 0.22
          # DockerEnvironment runs `docker run alpine:3.23.4@sha256:5b10...`
          # once per trial to decide whether it can enforce network_mode; on
          # fresh nodes the anonymous Docker Hub pull is rejected, the probe
          # returns False, egress control is disabled and EVERY no-network task
          # fails at Trial.create ("network_mode='no-network' is not supported
          # by EnvironmentType.DOCKER") -- r6 launch 2026-09-04 burned 270
          # groups this way. The ECR copy was made with `buildx imagetools
          # create` so the index digest is byte-identical; dind runs the
          # containerd image store, which resolves digest refs by target
          # digest, so the local copy satisfies the docker.io reference.
          PROBE_DIGEST=sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
          PROBE_ECR=427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:alpine-probe-3.23.4
          until docker pull -q "$PROBE_ECR@$PROBE_DIGEST"; do echo "probe image pull retry"; sleep 10; done
          docker tag "$PROBE_ECR@$PROBE_DIGEST" alpine:3.23.4
          docker run --rm "alpine:3.23.4@$PROBE_DIGEST" true && echo "probe image resolves locally"
          # Same failure one layer down: with the probe passing, harbor builds its
          # egress-control sidecar FROM docker.io/gogost/gost@sha256:afc0... (also
          # rejected on fresh nodes -> "Failed to build Docker image
          # harbor-prebuilt:harbor-docker-egress-control-sidecar--b1e6..."). Harbor
          # skips the build when `docker image inspect <content-addressed name>`
          # succeeds (harbor/environments/docker/utils.py ensure_docker_image_built),
          # so seed the image exported from an r5 pod (identical sidecar context in
          # harbor 0.22.0 -> identical hash b1e6760734a9e6f6).
          SIDECAR_ECR=427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:egress-sidecar-b1e6760734a9e6f6
          until docker pull -q "$SIDECAR_ECR"; do echo "sidecar image pull retry"; sleep 10; done
          docker tag "$SIDECAR_ECR" harbor-prebuilt:harbor-docker-egress-control-sidecar--b1e6760734a9e6f6
          # One r6 pod on a fresh node failed every trial with transformers'
          # "Repo id must be in the form 'repo_name'" -- AutoTokenizer fell
          # through to the Hub because ARENA_MODEL_PATH (mountpoint-s3 fast
          # scratch) was not readable yet. Gate on the tokenizer file.
          until [ -f "$ARENA_MODEL_PATH/tokenizer_config.json" ]; do echo "waiting for model mount $ARENA_MODEL_PATH"; sleep 5; done
          exec python3.12 -m amzn_arena_harbor.gym_worker \
            --nats-url nats://rl-glm53f16-nats:4222 \
            --gym snorkel-general-bash-harbor \
            --model policy \
            --model-base-url http://rl-glm53f16-sglang:30000 \
            --mode rollout \
            --agent vulcan
        env:
        # Per-task lakeFS materialization (pinned commit in the manifest row).
        - name: ARENA_LAKEFS_AUTH
          value: aws_iam
        - name: ARENA_LAKEFS_CACHE_DIR
          value: /trials/lakefs-cache
        - name: ARENA_MODEL_PATH
          value: /mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16
        # r6: 6000 (was 4500). The per-message rollout deadline is ack_wait - 300 s
        # and bounds ALL 8 trials of a group; with the 2x agent timeout below the
        # longest task (1800 s) becomes 3600 s + env build + verifier, and a group
        # that outlives the deadline is cancelled with ZERO trajectories. Trainer
        # side NATS_TASK_DEADLINE_SECS default 12600 s still covers this.
        # r8: 18000 (was 6000). Must cover multiplier x longest task (8 x 1800 =
        # 14400 s) + env build + verifier (<= 900 s) + the 300 s deadline margin
        # = ~15900 s; 18000 leaves slack. Trainer-side NATS_TASK_DEADLINE_SECS
        # is raised to 21600 in lockstep (default 12600 would expire groups).
        - name: ARENA_NATS_ACK_WAIT
          value: "18000"
        # r6: scale each task's [agent] timeout_sec (900-1800 s) by 2x. r5 timed
        # out ~90% of trials at ~13 turns / 60-120 s per turn; with 16 engines
        # and 2x wall clock most episodes should reach a natural stop. Raise
        # ARENA_NATS_ACK_WAIT in lockstep if this goes above 2.
        # r8 (2026-09-05): 8x (was 2x) -> 14400 s for 1800 s tasks, 7200 s for
        # 900 s tasks. r6/r7 evidence: ~100% of TRUNCATED samples were Harbor
        # wall-clock timeouts at 3600.0 s with every turn ending cleanly
        # (trial exception files on the r7 gym pods), not length clips.
        # Effort stays high (user decision). Harbor resolves
        # min(task timeout, max_timeout_sec=None) x multiplier -> no cap.
        - name: ARENA_AGENT_TIMEOUT_MULTIPLIER
          value: "8"
        # r7 (2026-09-05): per-call read timeout for /generate (image
        # glm53-sgltimeout-20260904b reads it; default 600 was hardcoded). r6 lost
        # 7-14% of samples per rollout to httpx.ReadTimeout on 32k-token turns.
        - name: ARENA_SGLANG_REQUEST_TIMEOUT_SEC
          value: "1800"
        - name: ARENA_ROLLOUT_MAX_CONCURRENCY
          value: "8"
        # 2026-09-02 user-directed (breaks r5 parity deliberately): GLM-5.3's
        # max-effort reasoning burned the whole 2048-token turn cap thinking —
        # first-rollout completions were 28/28 status=truncated, 0 success.
        # Per-turn 32k, episode 131k (= trainer rollout_max_context_len and
        # sglang_context_length). Keep ARENA_MAX_TOKENS in lockstep with the
        # trainer's rollout_max_response_len.
        - name: ARENA_MAX_TOKENS
          value: "32768"  # r11: back to r9 (r10 ran 8192); lockstep with rollout_max_response_len
        # r5: GLM-5.3 thinks 8-15k tokens/turn at its default "max" effort
        # (~500 s/turn at 4 saturated engines), so 87-93% of r4 trials hit the
        # 900-1800 s task.toml agent timeout. The template honors only
        # low|high (anything else silently renders "Max"; the gym client
        # raises instead). Per-episode prefix, rendered once on turn 1.
        - name: ARENA_REASONING_EFFORT
          value: "high"  # r7: was low in r5/r6
        - name: ARENA_TEMPERATURE
          value: "1.0"
        - name: ARENA_ROLLOUT_CONTEXT_LIMIT
          value: "131072"
        # r12 (2026-09-08): Vulcan compaction bound (default 4). One NATS result
        # message carries 8 trials x (compactions + 1) segments x up to 131k
        # tokens (gzip); 2 keeps it under the broker's 8 MiB max_payload
        # (nats.yaml). The gym warns above 6 MiB. Other ARENA_COMPACTION_*
        # knobs keep their defaults (FRACTION 0.8, SUMMARY 1, TRAIN_SUMMARY 1,
        # TAIL_FRACTION 0).
        - name: ARENA_TOOL_CALL_PARSER
          value: glm47  # r13: GLM-5.3 emits <tool_call>NAME<arg_key>; the qwen3_coder default parsed 0 calls in r12
        - name: ARENA_COMPACTION_MAX
          value: "2"
        - name: ARENA_TASK_EVENTS_LOG
          value: /tmp/task-events.jsonl
        # r16 (ADR-0012): TODO(orchestrator) uncomment once the shared mount
        # is confirmed; MUST equal the trainer value and the path MUST be the
        # same filesystem in both pods. /trials is an emptyDir, not shared.
        # - name: ARENA_ROUTING_DIR
        #   value: /mnt/scratch-s3files-rw/guparpit/routing/rl-glm53f-gbash-r16
        - name: DOCKER_HOST
          value: unix:///var/run/docker.sock
        # Harbor bind-mounts trial dirs into task containers; dockerd runs in
        # the dind sidecar, so trial dirs must live on a volume mounted at
        # the SAME path in both containers.
        - name: TMPDIR
          value: /trials
        securityContext:
          runAsUser: 0
        resources:
          requests:
            cpu: "8"
            memory: 32Gi
            ephemeral-storage: 50Gi
          limits:
            cpu: "16"
            memory: 64Gi
            ephemeral-storage: 100Gi
        volumeMounts:
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /trials
          name: trials
      - name: dind
        image: docker:dind
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
          limits:
            cpu: "8"
            memory: 32Gi
        volumeMounts:
        - mountPath: /var/run
          name: dind-sock
        - mountPath: /var/lib/docker
          name: dind-storage
        - mountPath: /trials
          name: trials
      volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-storage
        emptyDir:
          sizeLimit: 150Gi
      - name: trials
        emptyDir:
          sizeLimit: 100Gi
