  - name: deploy-gym-workers
    resource:
      action: create
      manifest: |
        # Harbor gym workers for the miles trainer: one
        # Deployment for one Harbor gym, replicas sized above the trainer's publisher
        # in-flight cap (arena_inflight_multiplier x rollout_batch_size).
        #
        # Double-brace Argo workflow tags are substituted at submit time, the at-sign slots at build time.
        # Labels: app=arena-gym-worker + arena.job are what the monitoring pod's gym
        # health checks and the onExit cleanup select on.
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "{{workflow.name}}-gym"
          labels:
            app: arena-gym-worker
            arena.gym: "{{workflow.parameters.gym}}"
            arena.job: "{{workflow.name}}"
        spec:
          replicas: {{workflow.parameters.gym-replicas}}
          selector:
            matchLabels:
              app: arena-gym-worker
              arena.job: "{{workflow.name}}"
          template:
            metadata:
              labels:
                app: arena-gym-worker
                arena.gym: "{{workflow.parameters.gym}}"
                arena.job: "{{workflow.name}}"
              annotations:
                karpenter.sh/do-not-disrupt: "true"
            spec:
              serviceAccountName: "arena-tasks-runner"
              enableServiceLinks: false
              # Same class as the trainer, NATS, and every other team's gym pods. With
              # no class the pods run at priority 0, and a high-priority gym Deployment
              # preempts them: two new 256-replica gyms once evicted 247 of the 864
              # workers on three live runs.
              priorityClassName: high
              # Keep gym + dind pods OFF the GPU nodes: p6-b200 nodes are untainted and
              # the trainer's 1200Gi / 0-CPU request leaves room the scheduler would
              # otherwise fill with these pods.
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node.kubernetes.io/instance-type
                        operator: NotIn
                        values:
                        - "p6-b200.48xlarge"
                      - key: node-type
                        operator: NotIn
                        values:
                        - "p6-gpu"
              containers:
              - name: gym-worker
                image: "{{workflow.parameters.gym-image}}"
                imagePullPolicy: Always
                command: ["bash", "-c"]
                args:
                - |
                  set -uo pipefail
                  # The model-cache emptyDir outlives a container restart, so the marker
                  # from the previous start would pass the readinessProbe before this
                  # script reaches the exec. Reset it first.
                  rm -f /model-cache/.worker-started
                  # harbor builds the egress-control sidecar (allow_internet=false) with
                  # `docker buildx build`; install the pinned plugin (verified sha).
                  BUILDX_URL=https://github.com/docker/buildx/releases/download/v0.30.1/buildx-v0.30.1.linux-amd64
                  BUILDX_SHA=c37114fcd034025ec68e224657c8a5a850df472ded3ddcbca75ad3a7ebb9710d
                  mkdir -p /usr/local/lib/docker/cli-plugins
                  until curl -sfL --max-time 120 "$BUILDX_URL" -o /usr/local/lib/docker/cli-plugins/docker-buildx \
                        && echo "$BUILDX_SHA  /usr/local/lib/docker/cli-plugins/docker-buildx" | sha256sum -c -; do
                    echo "buildx download retry"; sleep 10
                  done
                  chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
                  docker buildx version
                  ecr_login() {
                    aws ecr get-login-password --region us-west-2 \
                      | docker login --username AWS --password-stdin 427267593057.dkr.ecr.us-west-2.amazonaws.com
                  }
                  # Probe + egress-sidecar preseed images live in ap-south-1 (the cluster
                  # region); task images stay on us-west-2.
                  ecr_login_aps() {
                    aws ecr get-login-password --region ap-south-1 \
                      | docker login --username AWS --password-stdin 427267593057.dkr.ecr.ap-south-1.amazonaws.com
                  }
                  # Task images of some datasets (agentic-debt v3-locked) live on us-east-1.
                  ecr_login_use1() {
                    aws ecr get-login-password --region us-east-1 \
                      | docker login --username AWS --password-stdin 427267593057.dkr.ecr.us-east-1.amazonaws.com
                  }
                  until docker info >/dev/null 2>&1; do echo "waiting for dind"; sleep 2; done
                  until ecr_login; do echo "ecr login retry"; sleep 10; done
                  ( while sleep 21600; do ecr_login || true; done ) &
                  until ecr_login_aps; do echo "ecr aps login retry"; sleep 10; done
                  ( while sleep 21600; do ecr_login_aps || true; done ) &
                  until ecr_login_use1; do echo "ecr use1 login retry"; sleep 10; done
                  ( while sleep 21600; do ecr_login_use1 || true; done ) &
                  # Pre-seed harbor's egress-control kernel-probe image: on fresh nodes the
                  # anonymous Docker Hub pull is rejected, the probe returns False and EVERY
                  # no-network task fails at Trial.create. The ECR copy has the identical
                  # index digest, so the local copy satisfies the docker.io reference.
                  PROBE_DIGEST=sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
                  PROBE_ECR=427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:alpine-probe-3.23.4
                  until docker pull -q "$PROBE_ECR@$PROBE_DIGEST"; do echo "probe image pull retry"; sleep 10; done
                  docker tag "$PROBE_ECR@$PROBE_DIGEST" alpine:3.23.4
                  docker run --rm "alpine:3.23.4@$PROBE_DIGEST" true && echo "probe image resolves locally"
                  # Same failure one layer down: harbor builds its egress sidecar FROM
                  # docker.io/gogost/gost. Harbor skips the build when the content-addressed
                  # image already exists, so seed the prebuilt copy.
                  SIDECAR_ECR=427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:egress-sidecar-b1e6760734a9e6f6
                  until docker pull -q "$SIDECAR_ECR"; do echo "sidecar image pull retry"; sleep 10; done
                  docker tag "$SIDECAR_ECR" harbor-prebuilt:harbor-docker-egress-control-sidecar--b1e6760734a9e6f6
                  # The mountpoint-s3 FUSE endpoint dies per NODE: every access returns
                  # ENOTCONN, for every pod on that node, with no restart involved. The
                  # old startup gate was an unbounded `until [ -f ... ]` loop with no
                  # probe, so an affected pod idled for the whole run while it still
                  # reported Running and Ready. Verified on one live run: 18 of 288
                  # workers, 9 of them dead for 27 h, all with 0 restarts.
                  #
                  # Two independent guards, because the mount is not recoverable from
                  # inside the pod:
                  #   1. Copy the ~20 MB of tokenizer and config files to a pod-local
                  #      emptyDir. It survives container restarts, so an OOMKill never
                  #      has to read the mount again. The 121 safetensors shards stay
                  #      on S3; the gym reads only the tokenizer.
                  #   2. If the mount never becomes readable, clear ARENA_MODEL_PATH and
                  #      serve rollouts with SGLang's /tokenize endpoint instead
                  #      (sglang_rollout tokenizer_mode "remote"). One extra HTTP call
                  #      per turn to the router the pod already uses, against a worker
                  #      that otherwise contributes nothing.
                  if [ ! -f "$ARENA_MODEL_PATH/tokenizer_config.json" ]; then
                    MOUNT_TIMEOUT=600
                    MOUNT_DEADLINE=$(( $(date +%s) + MOUNT_TIMEOUT ))
                    while [ ! -f "$ARENA_MODEL_SOURCE_PATH/tokenizer_config.json" ]; do
                      if [ "$(date +%s)" -ge "$MOUNT_DEADLINE" ]; then break; fi
                      echo "waiting for model mount $ARENA_MODEL_SOURCE_PATH"; sleep 5
                    done
                    if [ -f "$ARENA_MODEL_SOURCE_PATH/tokenizer_config.json" ]; then
                      # Stage then rename, so a restart never reads a half-copied cache.
                      rm -rf "$ARENA_MODEL_PATH.staging"
                      mkdir -p "$ARENA_MODEL_PATH.staging"
                      for f in "$ARENA_MODEL_SOURCE_PATH"/tokenizer* \
                               "$ARENA_MODEL_SOURCE_PATH"/*config*.json \
                               "$ARENA_MODEL_SOURCE_PATH"/chat_template.jinja; do
                        [ -f "$f" ] && cp "$f" "$ARENA_MODEL_PATH.staging/"
                      done
                      mv "$ARENA_MODEL_PATH.staging" "$ARENA_MODEL_PATH"
                    fi
                  fi
                  if [ -f "$ARENA_MODEL_PATH/tokenizer_config.json" ]; then
                    echo "tokenizer cache ready: $(ls "$ARENA_MODEL_PATH" | tr '\n' ' ')"
                  else
                    # Grep this string to count workers degraded by a dead node mount.
                    echo "WARNING: model mount $ARENA_MODEL_SOURCE_PATH unreadable after ${MOUNT_TIMEOUT}s; falling back to the remote /tokenize endpoint" >&2
                    unset ARENA_MODEL_PATH
                  fi
                  # The readinessProbe gates on this marker, so a worker only counts as
                  # available after startup reaches the exec below.
                  touch /model-cache/.worker-started
                  # The caller-set agent-kwargs JSON reaches the command as one quoted
                  # env expansion, never as shell text.
                  exec python3.12 -m amzn_arena_harbor.gym_worker \
                    --nats-url nats://{{workflow.name}}-nats-svc:4222 \
                    --gym {{workflow.parameters.gym}} \
                    --model policy \
                    --model-base-url http://{{workflow.name}}-sglang:30000 \
                    --mode rollout \
                    --agent vulcan \
                    --agent-kwargs "$HARBOR_AGENT_KWARGS"
                env:
                - name: ARENA_USER
                  value: "{{workflow.parameters.username}}"
                - name: ARENA_JOB
                  value: "{{workflow.name}}"
                # Per-task lakeFS materialization (pinned commit in the manifest row).
                - name: ARENA_LAKEFS_AUTH
                  value: aws_iam
                - name: ARENA_LAKEFS_CACHE_DIR
                  value: /trials/lakefs-cache
                # Workers tokenize against the policy model. ARENA_MODEL_PATH is the
                # pod-local cache the startup script fills from ARENA_MODEL_SOURCE_PATH.
                - name: ARENA_MODEL_SOURCE_PATH
                  value: "/mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16"
                - name: ARENA_MODEL_PATH
                  value: /model-cache/tokenizer
                # Deadlines are workflow parameters, so a multi-step (chain) run can
                # size them. The defaults are 18000 s and 8. ack-wait
                # MUST cover multiplier x longest task (8 x 1800 s) + env build
                # + verifier + the 300 s deadline margin. For a chain gym, ack-wait
                # MUST cover the sum over steps (AREnATasks ADR-0069). A deadline cut
                # turns the whole chain into a 0.0 pad. ack-wait MUST stay below the
                # trainer trainer-task-deadline-secs (pytorch_job.yaml, default 21600);
                # otherwise the trainer gives up on a group before the gym redelivers it.
                - name: ARENA_NATS_ACK_WAIT
                  value: "{{workflow.parameters.ack-wait}}"
                - name: ARENA_AGENT_TIMEOUT_MULTIPLIER
                  value: "{{workflow.parameters.agent-timeout-multiplier}}"
                - name: ARENA_SGLANG_REQUEST_TIMEOUT_SEC
                  value: "1800"
                - name: ARENA_ROLLOUT_MAX_CONCURRENCY
                  value: "8"
                # MUST NOT set the output cap, window, temperature, or top_p here. The
                # trainer sends them in every task message (miles ADR-0015). The
                # rollout gym stops at startup when one of the old env names is set
                # (AREnATasks ADR-0072).
                - name: ARENA_REASONING_EFFORT
                  value: "high"
                # GLM-5.3 emits <tool_call>NAME<arg_key>; the qwen3_coder default parses
                # 0 calls.
                - name: ARENA_TOOL_CALL_PARSER
                  value: glm47
                # Vulcan constructor overrides, for example max_compactions (default
                # 4). One NATS result message holds max_compactions + 1 segments per
                # trial under the 64 MiB max_payload (nats_deployment.yaml), so a
                # chain run lowers it. The value is a JSON object with double quotes.
                # Argo substitutes this manifest as text and parses it again as YAML,
                # so sprig.toJson encodes the string as a valid quoted scalar.
                - name: HARBOR_AGENT_KWARGS
                  value: {{=sprig.toJson(workflow.parameters['agent-kwargs'])}}
                - name: ARENA_TASK_EVENTS_LOG
                  value: /tmp/task-events.jsonl
                # MUST equal the trainer value (pytorch_job.yaml).
                # Harbor merges task [environment].env into the docker compose env, so a
                # task HOME (agentic-debt v3-locked sets /home/agent) hides the ECR logins
                # in /root/.docker. Pin the Docker CLI config dir.
                - name: DOCKER_CONFIG
                  value: /root/.docker
                - name: ARENA_ROUTING_DIR
                  value: /mnt/scratch-s3files-rw/{{workflow.parameters.username}}/routing/{{workflow.parameters.experiment-name}}
                # Trajectory publication (AREnATasks ADR-0067). The worker copies each
                # finished Harbor job dir to publish-jobs-dir/RUN_ID/TASK/wvNNNN/.
                # An empty publish-jobs-dir turns publication off. The root sits on
                # the same platform-injected scratch mount as the routing dir above.
                - name: ARENA_PUBLISH_JOBS_DIR
                  value: "{{workflow.parameters.publish-jobs-dir}}"
                # The run id equals the checkpoint dir name under slime_experiments/.
                - name: ARENA_PUBLISH_RUN_ID
                  value: "{{workflow.parameters.experiment-name}}"
                # Opt in to the per-task tree. Without this value the worker writes
                # the flat RUN_ID--JOB layout next to the root.
                - name: ARENA_PUBLISH_TREE
                  value: "1"
                # ARENA_PUBLISH_INCLUDE_TOKENS stays unset: text only. The token file
                # agent/rollout.json is about 10x the bytes of the rest of a trial.
                - name: DOCKER_HOST
                  value: unix:///var/run/docker.sock
                # Harbor bind-mounts trial dirs into task containers; dockerd runs in the
                # dind sidecar, so trial dirs must live on a volume mounted at the SAME
                # path in both containers.
                - name: TMPDIR
                  value: /trials
                envFrom:
                - configMapRef:
                    name: "arena-infra-config"
                securityContext:
                  runAsUser: 0
                resources:
                  requests:
                    cpu: "8"
                    memory: 32Gi
                    ephemeral-storage: 50Gi
                  limits:
                    cpu: "16"
                    memory: 64Gi
                    ephemeral-storage: 100Gi
                # A worker stuck in startup serves no rollouts. Gate readiness on the
                # marker the startup script writes, so availableReplicas counts real
                # capacity instead of every pod that reached Running.
                readinessProbe:
                  exec:
                    command: ["test", "-f", "/model-cache/.worker-started"]
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 2
                volumeMounts:
                - mountPath: /var/run
                  name: dind-sock
                - mountPath: /trials
                  name: trials
                - mountPath: /model-cache
                  name: model-cache
              - name: dind
                image: "427267593057.dkr.ecr.ap-south-1.amazonaws.com/ghcr/agi-rl-gyms/arena-dind-container:latest"
                # Mutable latest tag; the packaged entrypoint prepares GPU CDI.
                imagePullPolicy: Always
                command: ["/usr/local/bin/start-dind.sh"]
                env:
                - name: DOCKER_TLS_CERTDIR
                  value: ""
                securityContext:
                  privileged: true
                # The 8 task containers of one group (ARENA_ROLLOUT_MAX_CONCURRENCY)
                # run inside this cgroup, not in their own (ADR-0012). The gym caps
                # each with ARENA_TASK_MEMORY_MB when that value is set; unset, the
                # task's own memory value applies. 64Gi holds 8 x 6 GiB plus dockerd.
                # On a 288-pod run the old 32Gi limit OOMKilled 8 sidecars in 40
                # minutes.
                #
                # The ephemeral-storage limit exists for the pod-level sum; see the
                # invariant on the volumes below. /var/lib/docker reached 20-39 GB
                # per pod after 1-2 groups, because each group pulls a different
                # 2-6 GB task image.
                resources:
                  requests:
                    cpu: "4"
                    memory: 32Gi
                    ephemeral-storage: 100Gi
                  limits:
                    cpu: "8"
                    memory: 64Gi
                    ephemeral-storage: 250Gi
                volumeMounts:
                - mountPath: /var/run
                  name: dind-sock
                - mountPath: /var/lib/docker
                  name: dind-storage
                - mountPath: /trials
                  name: trials
              volumes:
              - name: dind-sock
                emptyDir: {}
              # Invariant: the sum of the container ephemeral-storage limits
              # (gym-worker 100Gi + dind 250Gi = 350Gi) MUST exceed the sum of the
              # emptyDir sizeLimits (150Gi + 100Gi + 1Gi = 251Gi). The kubelet evicts
              # the pod on the container-limit sum, not on the emptyDir limit, and a
              # container with no limit adds 0. With the sum below the emptyDir total,
              # the pod is evicted before any sizeLimit fires: one pod was evicted
              # at 100Gi, the gym-worker limit alone.
              - name: dind-storage
                emptyDir:
                  sizeLimit: 150Gi
              - name: trials
                emptyDir:
                  sizeLimit: 100Gi
              # Survives container restarts, dies with the pod. Holds the tokenizer copy.
              - name: model-cache
                emptyDir:
                  sizeLimit: 1Gi
      setOwnerReference: true
  - container:
      args:
      - |
        set -eu
        kubectl annotate workflow "$WF_NAME" -n arena-tasks --overwrite \
          "workflows.argoproj.io/description=[**Run dashboard**](https://browser.${DOMAIN}/scratch/${RUN_PATH}/dashboard/index.html)" \
          || echo "annotate failed (non-fatal; needs workflows patch RBAC)"
      command:
