            .status { display:inline-block; border-radius:999px; padding:3px 11px;
              font-weight:600; font-size:12px; line-height:18px; }
            .ok { background:var(--good-bg); color:var(--good); }
            .bad { background:var(--bad-bg); color:var(--bad); }
