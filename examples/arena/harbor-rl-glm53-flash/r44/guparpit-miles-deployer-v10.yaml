apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  annotations:
    arena.agif.amazon.dev/derived-from: AREnATasksApps mainline e4bf764 (CR-308323875, tree dd41d85) rendered for ap-south-1
      + us-east-1 ECR login in the gym startup script (v8) + DOCKER_CONFIG=/root/.docker
      on the gym container (v9); defaults trainer miles-glm53-r14-20260927a, gym gym-glm53-adr72-20260927a
      (2026-09-27)
    created-by: guparpit
  labels:
    app.kubernetes.io/managed-by: arena-tasks-apps
  name: guparpit-miles-deployer-v10
  namespace: arena-tasks
spec:
  arguments:
    parameters:
    - default: '{{workflow.labels.workflows.argoproj.io/creator-preferred-username}}'
      name: username
    - name: experiment-name
      value: '{{workflow.name}}'
    - name: trainer-image
      value: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:miles-glm53-r14-20260927a
    - name: gym-image
      value: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:gym-glm53-adr72-20260927a
    - name: replicas
      value: '40'
    - name: replica-trainer
      value: '8'
    - name: miles-config
      value: |
        # Default `miles-config` of the arena-miles-deployer WorkflowTemplate
        # (ADR-0016): GLM-5.3-Flash (321B total / 18B active) GRPO on the Harbor NATS
        # gym worker. Derived from examples/arena/harbor-rl-27b-snorkel/snorkel-27b.yaml
        # (arena wiring, batch shape, GRPO block) with the model-bound blocks swapped
        # in from the upstream-validated GLM-5.3-Flash recipe (radixark/miles PR #2786,
        # scripts/run_glm5_3_flash.py, shape (8,4)). Cluster shape for 40 nodes:
        #   workers 0-7  = Megatron actor (64 GPUs: TP8+SP x PP4 [11/11/11/12 layers]
        #                  x CP1, EP16/ETP1, DP=2)
        #   workers 8-39 = SGLang engines (256 GPUs, 32 engines at TP8/EP8)
        #
        # This file is a template, not a launch config. The dataset path below is a
        # placeholder, so each launch MUST pass its own `miles-config` parameter. The
        # pod env (EXPERIMENT_NAME, USER, REPLICA, REPLICA_TRAINER) drives run identity
        # and cluster shape; the launcher keys here are the config-side record.
        #
        # The upstream recipe ran COLOCATED (--colocate --offload-train-target disk);
        # this job is DISAGGREGATED like every arena harbor-rl run, so the
        # colocate/offload flags are deliberately NOT carried over.
        #
        # Converted to a flat train argv by scripts/run_arena_harbor.py with
        # hydra_converter semantics (true -> bare flag, false/None -> dropped,
        # prompt-data-list -> --prompt-data moved last, 1e-6 -> 1e-06). The launcher
        # consumes user/cluster/experiment_name/project_name/agislime_dir/replicas/
        # num_trainers/model_arch — they never reach the trainer (miles argparse is
        # strict). Run identity (checkpoint dir, wandb group) comes from the
        # EXPERIMENT_NAME pod env (ADR-0004), and cluster shape from
        # REPLICA/REPLICA_TRAINER — the values here are the config-side record.
        #
        # Deltas vs the snorkel-27b.yaml parent (full table: README.md):
        #   - model_arch/hf_checkpoint/ref_load -> GLM-5.3-Flash-BF16 + its converted
        #     torch_dist checkpoint (convert-job.yaml writes it)
        #   - parallelism/perf/optimizer/sglang blocks -> upstream GLM recipe values
        #   - loss_mask_type: qwen3_5 REMOVED (see comment below)
        #   - attention_backend: flash REMOVED — GLM-5.3-Flash uses its own KDA/DSA
        #     spec (miles_plugins.models.glm5_next); the recipe sets no attention
        #     backend and forcing flash would fight the custom layers
        #   - sglang_enable_dp_attention REMOVED (qwen-specific; recipe runs dp_size 1)
        #   - sglang_tool_call_parser/sglang_reasoning_parser (qwen3_coder/qwen3)
        #     REMOVED — qwen-specific values would be wrong for GLM; the snorkel
        #     textual bash agent parses tool calls itself, so no parser is configured.
        #     UNVERIFIED for GLM output format — see README.md "Risks".
        user: arena
        cluster: bom
        # EXPERIMENT_NAME and PROJECT_NAME in the PyTorchJob pod env drive CKPT_DIR and
        # the W&B group; the launcher pops these keys, so they are the config-side
        # record only. NEVER reuse a finished run's name (silent resume).
        experiment_name: arena-miles-deployer
        project_name: arena-miles-deployer
        agislime_dir: /root/miles
        # 40 replicas = 8 actor nodes + 32 engine nodes (same convention as the parent:
        # replicas - num_trainers = rollout nodes; the launcher derives
        # --actor-num-nodes 8 and --rollout-num-gpus 128 from these + the pod env)
        replicas: 40
        num_trainers: 8
        # -> scripts/models/glm5.3-flash.py (ships in the merged image tree)
        model_arch: glm5.3-flash
        # NOTE: /mnt/models-ro is a separate curated EFS volume (NFS), NOT a view of
        # fast scratch — the fetched model lives only on fast scratch, so both model
        # paths read the mountpoint-S3 fast-scratch mount directly.
        hf_checkpoint: /mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16
        # ref_load lives on EFS (scratch-s3files-rw), not fast scratch: the PP8
        # conversion produces 83 GB .distcp shards and mountpoint-S3 caps objects
        # at ~78 GiB (part-size x 10k parts), so cp fails with EFBIG. EFS has no
        # such cap and is the proven ref_load home.
        # Shared base checkpoint: each launch MUST point ref_load at its own copy.
        ref_load: /mnt/scratch-s3files-rw/guparpit/checkpoints/dcp/glm5.3-flash_torch_dist
        # A step is ~3 h. One node fabric fault cost 3 steps with no checkpoint
        # between them, so 5 bounds the loss to ~15 h.
        save_interval: 5
        no_load_optim: true
        no_save_optim: true
        rollout_function_path: miles_plugins.arena.nats_arena.nats_rollout.generate_rollout
        data_source_path: miles_plugins.arena.nats_arena.data_source.ArenaDataSourceWithBuffer
        # Dataset: the KNOWN_GYMS registry pin for snorkel-general-bash-harbor (all
        # 2922 validated tasks; see the snorkel-27b parent README for provenance and
        # the dev-set caveat). PLACEHOLDER: the path sits under the deployer data
        # mount (ARENA_DATA_DIR = /mnt/scratch-s3files-rw/<username>/data in
        # pytorch_job.yaml) and does not resolve. Each launch MUST pass its own
        # `miles-config` with the real manifest path.
        prompt-data-list: '[{"path":"/mnt/scratch-s3files-rw/<username>/data/snorkel-general-bash-harbor/<dataset-version>/manifest.jsonl","gym_name":"snorkel-general-bash-harbor","weight":1.0}]'
        sglang_disable_overlap_schedule: true
        # sglang router binds on replica-index 0, where the deployer's -sglang Service
        # points (smoke-proven pattern)
        pin_rollout_manager_to_head: true
        input_key: messages
        metadata_key: metadata
        apply_chat_template: false
        # loss_mask_type is INTENTIONALLY OMITTED — but note: unset does NOT mean
        # pass-through. The parser default is 'qwen' (miles/utils/arguments.py,
        # choices qwen/qwen3/qwen3_5/distill_qwen — no GLM type exists), and
        # nats_rollout.py feeds it into MultiTurnLossMaskGenerator whenever the
        # tokenizer fallback fires (any trajectory whose last step lacks
        # has_generate_tokens: messages-only / openai-client / old-gym trajectories).
        # What actually makes the omission safe HERE is `use_rollout_logprobs: true`
        # (below): every fallback sample gets zero-filled rollout_log_probs + status
        # ABORTED + remove_sample=True (nats_rollout.py), so it contributes zero
        # gradient, and a get_loss_mask exception is caught and padded at the group
        # converter. use_rollout_logprobs is therefore LOAD-BEARING for this
        # omission — do NOT disable it (or copy this yaml without it) unless a GLM
        # mask type is added first: the qwen heuristic silently produces masks on
        # GLM's template with zero warning.
        # Curriculum order (easiest first by GPT-5.6 solve rate): the manifest is
        # pre-sorted, so no shuffle. The data source walks it in order.
        rollout_shuffle: false
        rollout_skip_special_tokens: true
        # ~10 passes over the 2922-task list. Dynamic sampling publishes ~3.5x the
        # kept groups (111-127 published per 32 kept), so at batch 64 each rollout
        # draws ~224 prompts -> ~13 rollouts per pass -> 130 for 10 passes. Batch 64
        # also sets the publisher's in-flight cap (arena_inflight_multiplier x batch),
        # which keeps every engine fed.
        num_rollout: 130
        rollout_batch_size: 64
        n_samples_per_prompt: 8
        # 32768 per turn. The trainer sends this value to the gym in every task
        # message (AREnATasks ADR-0072, miles ADR-0015). A shorter cap (2048 or 8192)
        # truncated GLM's reasoning on every first-rollout episode. Long-sample watch
        # items: samples up to ~131k tokens overflow the 8192 max_tokens_per_gpu
        # microbatch budget alone (allowed, memory headroom absorbs it) and fatten
        # NATS result messages toward the 64 MiB max_payload.
        rollout_max_response_len: 32768
        rollout_temperature: 1
        global_batch_size: 512
        balance_data: true
        # ---- sglang block: upstream GLM-5.3-Flash recipe (PR #2786) ----
        # 4 engines at 8 GPUs each (vs the parent's 8 engines at 4 GPUs): GLM needs a
        # full node per engine (bf16 weights ~643 GB -> ~80 GB/GPU at TP8).
        rollout_num_gpus_per_engine: 8
        # DERIVED, kept only for recipe parity: miles/backends/sglang_utils/
        # arguments.py unconditionally overwrites sglang_tp_size with
        # rollout_num_gpus_per_engine — editing this key alone is silently ignored.
        sglang_tp_size: 8
        sglang_ep_size: 8
        sglang_dp_size: 1
        rollout_max_context_len: 131072
        sglang_context_length: 131072
        sglang_chunked_prefill_size: 8192
        sglang_disable_radix_cache: true
        # tilelang/tilelang is effectively forced: the model config's index_kpool=4
        # restricts DSA backends to fa3/tilelang/trtllm, and on B200 with bf16 KV
        # tilelang is the only validated prefill backend besides trtllm.
        sglang_dsa_prefill_backend: tilelang
        sglang_dsa_decode_backend: tilelang
        # REQUIRED, not cosmetic: on SM100 (B200) the DSA family auto-defaults
        # kv-cache dtype to fp8_e4m3, and sglang's tilelang+fp8 check then raises
        # ValueError. Do not "simplify" by removing this key.
        sglang_kv_cache_dtype: bfloat16
        sglang_mem_fraction_static: 0.7
        sglang_router_port: 30000
        # router health knobs from the GLM recipe: DSA engine startup is slow, give
        # the router 40 x 15 s before declaring an engine dead
        router_health_success_threshold: 1
        router_health_check_interval_secs: 15
        router_health_failure_threshold: 40
        update_weights_interval: 1
        # intentionally inert on the arena NATS path (no consumer reads it for a
        # custom rollout function); kept for config parity with the parent
        partial_rollout: true
        gym_autoscale: false
        skip_eval_before_train: true
        distributed_timeout_minutes: 60
        rollout_health_check_interval: 300
        # 900 (was 300): with use_fault_tolerance ON the monitor's health probe competes
        # with ~100 active + ~30 queued 30k-token requests per engine (KV usage ~0.97
        # under load); a 300 s timeout risks a false kill of a HEALTHY engine and the
        # loss of its in-flight trajectories. 900 s still detects a truly dead engine
        # within one rollout.
        rollout_health_check_timeout: 900
        # Without this the two health knobs above are INERT (rollout_manager.py:115-123)
        # and one dead engine kills the run: one run served 32 min on 3 engines and
        # then died when update_weights called the dead actor (SGLangEngine actors
        # have no max_restarts). With FT the RolloutHealthMonitor
        # stops the dead engine and recover_updatable_engines rebuilds it at the next
        # update_weights (rollout_manager.py:343-354, server_group.py:215-245;
        # ft_components defaults to [rollout]). UNVALIDATED on the arena NATS path:
        # kill one engine's sglang in the 5-node smoke first; a 300 s health_generate
        # under 100-deep queues could false-kill a healthy engine (then raise
        # rollout_health_check_timeout to 600).
        use_fault_tolerance: true
        # ---- parallelism: upstream GLM recipe, shape (8,4) scaled to 64 GPUs ----
        # TP8+SP x PP4 x CP1 = 32 GPUs per replica-group, DP=2 on 64 actor GPUs.
        # 45 layers split 11/(11/11)/12 across the 4 pipeline stages (MTP layer 45 is
        # dropped for training).
        tensor_model_parallel_size: 8
        sequence_parallel: true
        pipeline_model_parallel_size: 4
        decoder_first_pipeline_num_layers: 11
        decoder_last_pipeline_num_layers: 12
        context_parallel_size: 1
        expert_model_parallel_size: 16
        expert_tensor_parallel_size: 1
        # ---- perf block: upstream GLM recipe ----
        recompute_granularity: full
        recompute_method: uniform
        recompute_num_layers: 1
        # Reconciliation with the parent's dynamic-batch mechanism: the parent ran
        # use_dynamic_batch_size + max_tokens_per_gpu 65536; the GLM recipe ran plain
        # micro_batch_size 1 + max_tokens_per_gpu 8192. Recipe values win for the
        # model-bound token budget (8192 — 321B at full recompute cannot take 65536);
        # dynamic batching (the arena packing mechanism) is kept, and micro_batch_size
        # 1 is the recipe-faithful fallback (ignored while dynamic batching is on).
        micro_batch_size: 1
        use_dynamic_batch_size: true
        max_tokens_per_gpu: 8192
        # Pads each thd micro-batch token stream to a multiple of TP*512 = 4096 tokens
        # (default 128 -> 1024; miles/backends/training_utils/data.py:228-232).
        # tilelang_sparse_mla_bwd takes S/S_kv as static ints while the fwd uses
        # T.dynamic, so the DSA backward triplet re-JITs for every distinct padded
        # length (~3300 compile events across 64 ranks in one run, ~12 s each, a
        # stall of all PP stages); 4096-token granularity cuts distinct lengths
        # ~37 -> ~10 for
        # ~+6.5% pad tokens. Pad tokens form their own cu_seqlens segment -- verify
        # loss parity in the smoke.
        data_pad_size_multiplier: 512
        # ---- misc: upstream GLM recipe ----
        attention_dropout: 0.0
        hidden_dropout: 0.0
        accumulate_allreduce_grads_in_fp32: true
        attention_softmax_in_fp32: true
        update_weight_buffer_size: 1073741824
        train_memory_margin_bytes: 3221225472
        qkv_format: thd
        # selects the megatron<->sglang weight mapping (miles_plugins.models.glm5_next)
        # in the weight updater and the HF export path; the HF config class name alone
        # does not resolve it — the recipe passes this explicitly
        model_name: glm5_next
        # check_weight_update_equal is OFF. Its cost is NOT a per-update compare but a
        # permanent ~73 GiB anonymous CPU copy of every TP rank's parameter shard
        # (sglang weight_checker.py:114-121 `param.data.detach().cpu()`, issued once at
        # startup by miles/ray/placement_group.py:213-217 and never released): 8 ranks x
        # ~79 GiB = ~632 GiB of the 1934 GiB Ray counted on the engine node at one
        # OOM kill. Step-0 megatron->sglang equality is already verified. Re-enable
        # only in a single-engine smoke (false -> the launcher drops the flag; the skip list is
        # meaningless without it, so it is removed too).
        check_weight_update_equal: false
        # ---- algorithm/GRPO block: upstream GLM recipe
        # (examples/experimental/openenv/glm52_tbench2/run_glm5_2_744b_a40b_daytona.py
        # L200-210): eps 0.2/0.28 and the TIS knobs (tis_clip 2.0, low 0.0; use_tis
        # below is off). Without routing replay every run showed train/ppo_kl ~0.008
        # and pg_clipfrac ~1.1% at step 0 (a pure train/inference mismatch; miles
        # ci_utils asserts <1e-8 on-policy) and a flat reward. TIS reweights each
        # token by clip(pi_train/pi_rollout, 0, 2) with the SGLang logprobs the gym
        # already ships. ----
        advantage_estimator: grpo
        # ON. arguments.py:3185 forbids use_rollout_logprobs together with use_tis
        # (TIS recomputes old_log_probs with the actor, one extra forward per step,
        # and uses rollout_log_probs only as the IS denominator); use_tis below is
        # off. The loss_mask_type safety net above relies on it: slow-path
        # (messages-only) samples are zero-filled and removed only under
        # use_rollout_logprobs. The Vulcan gym always ships has_generate_tokens (0
        # slow-path samples over two 120-step runs). Fast-path bad-logprob samples
        # are zero-filled and ABORTED unconditionally (nats_rollout.py ~L495).
        use_rollout_logprobs: true
        # TIS off. Under routing replay train/tis logged 1.000 and tis_clipfrac
        # 0.1%, so TIS corrects nothing and its old-logprob pass costs 5 min per step.
        use_tis: false
        tis_clip: 2.0
        # R3 rollout routing replay (arXiv 2510.11370; miles arena ADR-0012).
        # Without it every run showed train/ppo_kl ~0.008 and pg_clipfrac ~1.1% at
        # step 0 with a flat reward. For a MoE the dominant train/inference mismatch
        # is route flips: SGLang and Megatron pick different top-k experts for the
        # same token. R3 replays the SGLang routing in the actor forward and
        # backward, so that term goes to zero. The residual (DSA indexer top-k is
        # not replayed: 3.6 GB per episode, ADR-0012 decision 1) stays uncorrected
        # because use_tis is off. Sets SGLang
        # enable_return_routed_experts on the engines and capture_routed_experts on
        # every NATS task message. The gym writes one int32 blob per segment
        # (~1.4 KB per token, ~58 MB per 40k-token episode) under ARENA_ROUTING_DIR
        # and ships a {path,bytes,sha256} pointer; the trainer decodes at batch
        # drain time and deletes the file. Under R3 train/kl_loss is not a valid
        # on-policy check (the ref model runs without replay).
        use_rollout_routing_replay: true
        tis_clip_low: 0.0
        keep_old_actor: false
        # use_kl_loss/kl_loss_type DROPPED: with kl_loss_coef 0.0 the gradient is
        # identical, but use_kl_loss forced with_ref=True -> ref checkpoint load, a
        # second pinned bf16 CPU backup per actor rank, and a full ref forward over
        # the whole GBS every step = 2388 s of a 7722 s train step (31% of the
        # step). Upstream run_glm5_3_flash.py runs no ref pass. Only the
        # train/kl_loss diagnostic is lost; kl coefs stay pinned at 0.0 explicitly.
        kl_coef: 0.0
        kl_loss_coef: 0.0
        entropy_coef: 0.0
        eps_clip: 0.2
        eps_clip_high: 0.28
        eps_clip_c: 2.0
        # ---- optimizer: upstream GLM recipe (lr 15e-7 -> 1e-6) ----
        optimizer: adam
        lr: 1e-6
        lr_decay_style: constant
        weight_decay: 0.1
        adam_beta1: 0.9
        adam_beta2: 0.98
        use_distributed_optimizer: true
        # ---- optimizer CPU offload ----
        # Without offload, train step 0 fit (peak ~109 GB allocated/rank after the
        # step) but step 1 CUDA-OOMed in the fla KDA backward on a ~37k-token sample ("177 GiB in use,
        # 144 GiB allocated, 1 GiB free"): step 1 carries the Adam states (fp32 master +
        # m + v, ~33 GB/rank even sharded over DP=2) that did not exist during step 0,
        # and the KDA layers run all 64 heads on every TP rank, so long-sequence
        # backward transients are large. Optimizer offload to CPU frees that
        # headroom; this is the trio every upstream large-MoE recipe in miles uses
        # (scripts/run_deepseek_v32.py, amd/run_glm5_2_744b_a40b.py). Megatron requires
        # precision-aware with cpu-offload; miles asserts the reverse implication too.
        # Host cost: ~66 GB fp32 state per rank -> ~530 GB per actor node (fits the
        # 1800Gi limit; engines nodes unaffected).
        optimizer_cpu_offload: true
        overlap_cpu_optimizer_d2h_h2d: true
        use_precision_aware_optimizer: true
        # ---- tracking ----
        use_tensorboard: false
        use_wandb: true
        use_distributed_post: true
        # enable_trajectory_tracing REMOVED (parent carried `false`): NO miles flag
        # with that name is registered anywhere — it is a deploy.sh-era AGISlime env
        # key. `false` was inert (the converter drops false booleans) but flipping it
        # to true would emit an unknown flag and kill the trainer at argparse.
        arena_sample_mode: full_trajectory
        # Publisher in-flight cap = 4 x rollout_batch_size = 256 groups
        # (nats_rollout.py _publisher_max_in_flight). With the default 2x (128
        # groups) 32 engines sat at KV ~0.83 with an empty queue; 4x keeps the
        # engines fed. Size the gym Deployment replicas above this cap
        # (gym_worker_deployment.yaml: 288). The trainer image MUST know this key;
        # otherwise the strict argparse kills the trainer at startup.
        arena_inflight_multiplier: 4
        # Train every segment of an episode (miles arena ADR-0011). The trainer
        # image MUST know this key; otherwise the strict argparse kills the trainer
        # at startup. The Vulcan gym
        # (AREnATasks ADR-0048) starts a new rollout segment at each context
        # compaction and ships one step per segment. `final` (the default) trains the
        # last segment only. `all` trains every segment as its own Sample with a
        # shared rollout_id and the episode reward. global_batch_size still counts
        # episodes (512); the row count per step is data dependent, so the trainer
        # pads it with zero-loss sibling rows to a multiple of the DP alignment (DP=2
        # here: 64 actor GPUs / (TP8 x PP4)) because build_dp_schedule cannot split
        # a singleton micro-batch. Read rollout/num_training_samples (rows per step)
        # and rollout/episode_raw_reward (one value per episode, not per row).
        arena_train_segments: all
        log_passrate: false
        wandb_host: https://mega.wandb.agi.amazon.dev
        wandb_project: arena-rl
        wandb_team: arena
        wandb_always_use_train_step: false
        # wandb group = EXPERIMENT_NAME, appended by the launcher
        # Zero-variance groups carry no GRPO gradient; drop them and fetch extras
        # (examine cap 4x target via --dynamic-sampling-max-examine-mult default).
        dynamic_sampling_filter_path: miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std
    - name: excluded-nodes
      value: '[]'
    - name: gym
      value: snorkel-general-bash-harbor
    - name: gym-replicas
      value: '288'
    - name: ack-wait
      value: '18000'
    - name: agent-timeout-multiplier
      value: '8'
    - name: agent-kwargs
      value: '{}'
    - name: publish-jobs-dir
      value: /mnt/scratch-s3files-rw/harbor-training
    - name: trainer-task-deadline-secs
      value: '21600'
  entrypoint: main
  onExit: finalize
  serviceAccountName: arena-tasks-runner
  templates:
  - container:
      args:
      - |
        kubectl delete deployment -l arena.job={{workflow.name}} -n arena-tasks --ignore-not-found
        kubectl delete pytorchjob -l arena.job={{workflow.name}} -n arena-tasks --ignore-not-found
        kubectl delete svc -l arena.job={{workflow.name}} -n arena-tasks --ignore-not-found
        kubectl delete configmap {{workflow.name}}-config -n arena-tasks --ignore-not-found
        # No LocalQueue to delete: the trainer uses the shared, infra-provisioned
        # LocalQueue (never a per-run one), which must NOT be deleted here.
        echo "Done"
      command:
      - sh
      - -c
      image: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/os-images:dockerhub-alpine-k8s-1.36.1-260902
    name: cleanup
  - container:
      args:
      - /work/finalize_render.sh
      command:
      - sh
      env:
      - name: ARENA_USER
        value: '{{workflow.parameters.username}}'
      - name: ARENA_JOB
        value: '{{workflow.name}}'
      - name: RUN_ROOT
        value: /workdir/run
      - name: RUN_PATH
        value: '{{workflow.parameters.username}}/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{workflow.name}}'
      - name: MODEL_ARCH
        value: glm5.3-flash
      - name: MODEL_NAME
        value: policy
      - name: N_SAMPLES_PER_PROMPT
        value: ''
      - name: GYMS
        value: '[{"name":"{{workflow.parameters.gym}}","replicas":{{workflow.parameters.gym-replicas}}}]'
      - name: INSPECT_LOG_DIR
        value: ''
      - name: TRAINER_IMAGE
        value: '{{workflow.parameters.trainer-image}}'
      - name: RUNNER_IMAGE
        value: 427267593057.dkr.ecr.us-east-1.amazonaws.com/arena-tasks:latest
