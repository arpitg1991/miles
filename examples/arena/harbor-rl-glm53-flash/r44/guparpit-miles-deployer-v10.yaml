  - container:
      args:
      - |
        # Gate the gym fan-out on the trainer's NATS handshake.
        #
        # The miles launcher on worker-0 logs `NATS connected (initial)` once the
        # rollout manager has created its streams. A gym worker that publishes before
        # that point finds no consumer and its groups drop. Kueue admission can take
        # hours, so the loop tolerates a missing pod (no log yet) and only gives up when
        # the PyTorchJob itself reports Failed -- the monitoring pod then finalizes the
        # run and the onExit handler tears the stack down.
        until kubectl logs {{workflow.name}}-trainer-worker-0 -c pytorch -n arena-tasks 2>/dev/null \
            | grep -q 'NATS connected (initial)'; do
          _ts=$(kubectl get pytorchjob {{workflow.name}}-trainer -n arena-tasks \
            -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
          case " $_ts " in
            *" Failed "*) echo "trainer PyTorchJob Failed before NATS connected -- not deploying gym workers"; exit 1 ;;
          esac
          echo "Waiting for trainer worker-0 to log 'NATS connected (initial)'..."
          sleep 30
        done
        echo "Trainer connected to NATS -- deploying gym workers"
      command:
      - sh
      - -c
      image: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/os-images:dockerhub-alpine-k8s-1.36.1-260902
