      - name: WF_NAME
        value: '{{workflow.name}}'
      - name: RUN_PATH
        value: '{{workflow.parameters.username}}/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{workflow.name}}'
      envFrom:
      - configMapRef:
          name: arena-infra-config
      image: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/os-images:dockerhub-alpine-k8s-1.36.1-260902
    name: annotate
  - container:
      args:
      - /work/heartbeat.sh
      command:
