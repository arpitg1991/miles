            tbody tr:last-child td { border-bottom:none; }
            td { font-size:14px; color:var(--ink-2); }
            td.num { text-align:right; font-variant-numeric:tabular-nums; }
            code { background:var(--code); border:1px solid var(--line); border-radius:6px;
