            [#
              Slime RL training run report - rendered pod-side by render_report.py.

              Jinja uses custom delimiters instead of the defaults: this file travels
              inside the generated WorkflowTemplate's script text, and Argo parses
              default-delimiter (double-brace) tags as its own template syntax at submit
              time — keep that character pair out of this file entirely
              (test_slime_deployer pins it).

              Pointer-first: the report routes to the authoritative sources (W&B for metric
              curves, inspect view for trajectories, Argo for the workflow) rather than
              duplicating metrics. The monitoring pod re-renders it on a heartbeat, so the
              status cards below reflect live trainer / gym-worker / trajectory state; the
              page self-refreshes so an open tab tracks the run.

              Design system mirrors the shared arena-portal / eval-dashboard shell used by
              the scratch browser: matching light/dark tokens, pre-paint resolver,
              system-theme tracking, appbar, typography, and responsive shell.
            #]
            <!doctype html><html lang="en"><head><meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="light dark">
            [% if refresh %]<meta http-equiv="refresh" content="[[ refresh ]]">
            [% endif %]<link rel="stylesheet" href="/vendor/fonts/averia-serif-libre/averia-serif-libre.css">
            <title>[[ title ]]</title>
            <script>
            (function () {
              var media = null;
              try { media = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) {}
              function systemTheme() {
                return media && media.matches ? "dark" : "light";
              }
              function savedTheme() {
                try {
                  var t = localStorage.getItem("arena-theme");
                  return t === "dark" || t === "light" ? t : "";
                } catch (e) {
                  return "";
                }
              }
              var theme = savedTheme();
              if (theme === systemTheme()) {
                theme = "";
                try { localStorage.removeItem("arena-theme"); } catch (e) {}
              }
              document.documentElement.setAttribute("data-theme", theme || systemTheme());
            })();
            </script>
            <style>
            :root, [data-theme="light"] { color-scheme: light; --bg:#ffffff; --bg-soft:#fafafa;
              --panel:#ffffff; --ink:#0a0a0a; --ink-2:#404040; --muted:#737373; --line:#ececec;
              --line-2:#e0e0e0; --accent:#4f46e5; --accent-ink:#4338ca; --good:#047857;
              --good-bg:#ecfdf5; --bad:#b91c1c; --bad-bg:#fef2f2; --code:#f5f5f5;
              --header-bg:rgba(255,255,255,.78);
              --shadow-sm:0 1px 2px rgba(10,10,10,.04), 0 1px 3px rgba(10,10,10,.06);
              --radius:14px; }
            @media (prefers-color-scheme: dark) {
