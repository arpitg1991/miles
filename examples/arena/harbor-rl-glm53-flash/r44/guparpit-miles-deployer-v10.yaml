      - mode: 420
        name: render-report-py
        path: /work/render_report.py
        raw:
          data: |
            """Pod-side renderer for the Slime RL training run report.

            Embedded verbatim (quoted heredoc) into the monitoring + finalize scripts by
            ``slime_deployer_builder`` and executed inside the arena-tasks runner image
            (which ships jinja2) from a private ``mktemp -d`` dir — not world-writable
            ``/tmp``. This package's own environment never imports this file. Everything is
            read from the environment (same contract for the heartbeat and the exit
            handler; the heartbeat sets ``WF_STATUS=Running`` while the trainer runs, the
            exit handler gets the real final status).

            Pointer-first: the report routes to W&B (metric curves), the trajectory prefix,
            and Argo — it does not duplicate metrics. What it renders itself is live status
            pulled from the K8s API (trainer PyTorchJob + gym-worker pods) plus the run
            manifest and the gym fan-out. The script:

            - writes ``$RUN_ROOT/run-manifest.json`` (the audit record) FIRST, before any
              non-stdlib import, so a render failure never costs the manifest;
            - queries the trainer PyTorchJob + gym-worker pod status (best-effort; a denied
              or unreachable API degrades a card to "unknown", never fails the render);
            - counts persisted ``.eval`` trajectories under ``$INSPECT_LOG_DIR`` when set;
            - renders the template (``$REPORT_TEMPLATE``) to ``$RUN_ROOT/dashboard/index.html``.

            The template uses ``[[ ]]`` / ``[% %]`` / ``[# #]`` delimiters: this script
            (template alongside) travels inside the generated WorkflowTemplate's text, and
            Argo parses default double-brace tags at submit time.
            """

            from __future__ import annotations

            import glob
            import json
            import os
            import re
            import ssl
            import urllib.request
            from datetime import UTC, datetime
            from typing import Any

            # The template path is passed in (a private mktemp -d dir, not world-writable
            # /tmp); fall back to a co-located default for standalone/local runs.
            _TEMPLATE_PATH = os.environ.get("REPORT_TEMPLATE", "") or os.path.join(
                os.path.dirname(os.path.abspath(__file__)), "report.html.j2"
            )
            _SA = "/var/run/secrets/kubernetes.io/serviceaccount"
            # Mount prefixes the Kyverno S3 policies inject into PVC-less arena-tasks pods;
            # both present the scratch bucket at root, so a path under either maps to the
            # browser scratch key by stripping the prefix.
            _SCRATCH_MOUNTS = ("/mnt/scratch-s3-rw", "/mnt/scratch-s3files-rw")


            def _k8s_get_raw(path: str) -> bytes:
                """GET a path from the in-cluster K8s API via the SA token (raw bytes)."""
                ctx = ssl.create_default_context(cafile=_SA + "/ca.crt")
                url = "https://{}:{}{}".format(
                    os.environ["KUBERNETES_SERVICE_HOST"],
                    os.environ["KUBERNETES_SERVICE_PORT"],
                    path,
                )
                with open(_SA + "/token", encoding="utf-8") as f:
                    token = f.read()
                req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
                return urllib.request.urlopen(req, timeout=10, context=ctx).read()


            def _k8s_get(path: str) -> dict[str, Any]:
                """GET a namespaced object from the in-cluster K8s API (parsed JSON)."""
                return json.loads(_k8s_get_raw(path))


            def _k8s_get_text(path: str) -> str:
                """GET a text endpoint (e.g. pods/<p>/log) from the K8s API."""
                return _k8s_get_raw(path).decode("utf-8", "replace")


            def _trainer_status(job: str) -> dict[str, str]:
                """Live trainer PyTorchJob state (best-effort; 'unknown' on any failure)."""
                try:
                    obj = _k8s_get(f"/apis/kubeflow.org/v1/namespaces/arena-tasks/pytorchjobs/{job}-trainer")
                except Exception:  # RBAC / not-yet-created / API down — degrade the card.
                    return {"state": "unknown", "detail": "status unavailable"}
                conditions = (obj.get("status") or {}).get("conditions") or []
                # The last-transitioned "True" condition is the current PyTorchJob phase
                # (Created -> Running -> Succeeded/Failed).
                active = [c for c in conditions if c.get("status") == "True"]
                state = active[-1]["type"] if active else "Pending"
                worker = ((obj.get("status") or {}).get("replicaStatuses") or {}).get("Worker") or {}
                parts = [f"{k.lower()}: {v}" for k, v in worker.items() if isinstance(v, int)]
                return {"state": state, "detail": ", ".join(parts) or "no replica status yet"}


            def _worker_pods(job: str) -> dict[str, int]:
                """Gym-worker pod readiness (Ready / total) for the run (best-effort)."""
                try:
                    sel = f"arena.job={job},app=arena-gym-worker"
                    obj = _k8s_get(f"/api/v1/namespaces/arena-tasks/pods?labelSelector={sel}")
                except Exception:
                    return {"ready": 0, "total": 0}
                pods = obj.get("items") or []
                ready = 0
                for pod in pods:
                    conds = (pod.get("status") or {}).get("conditions") or []
                    if any(c.get("type") == "Ready" and c.get("status") == "True" for c in conds):
                        ready += 1
                return {"ready": ready, "total": len(pods)}


            def _trajectory_summary(log_dir: str) -> dict[str, Any]:
                """Count persisted .eval trajectories and the latest refit seen (best-effort).

                ``n`` is the raw count (0 when off/none); ``count`` is its display string.
                The caller gates the trajectory link on ``n`` so it is only shown once at
                least one .eval exists — the link targets the raw prefix, which the artifact
                browser 404s while empty (no index object under it).
                """
                if not log_dir:
                    return {"n": 0, "count": "off", "detail": "inspect-log-dir not set"}
                files = glob.glob(log_dir + "/**/*.eval", recursive=True)
                refits: list[int] = []
                for path in files:
                    # Filenames are <task-id>_refit-<N>_<hex>.eval; pull N when present.
                    for part in os.path.basename(path).split("_"):
                        if part.startswith("refit-") and part[6:].isdigit():
                            refits.append(int(part[6:]))
                detail = f"refit ≤ {max(refits)}" if refits else "no refit tag yet"
                return {"n": len(files), "count": f"{len(files):,}", "detail": detail}


            # Megatron logs one such line per DCP save. The iteration number is the training
            # step at save time; distinct iterations = distinct saved checkpoints.
            _CKPT_SAVE_RE = re.compile(r"saving checkpoint at iteration\s+(\d+)", re.IGNORECASE)

            # The AGISlime eval-on-checkpoint trigger creates one Argo Workflow per saved
            # checkpoint, named ``<job>-eval-s<step>-<hash>`` (see argo_eval_trigger.py).
            # The set of these workflows is a DURABLE source of truth for the run's step /
            # checkpoint counts — it survives trainer PyTorchJob teardown, which the pod-log
            # grep does not (the trainer's ttlSecondsAfterFinished cleans it up 300s after
            # it finishes, before the final onExit render on a bounded-finalize / auto-
            # completed run).
            _EVAL_STEP_RE = re.compile(r"-eval-s(\d+)-")


            def _eval_trigger_steps(job: str) -> list[int]:
                """Trigger-fired eval steps for the run — sorted ascending, or [] on failure.

                Best-effort: any failure (RBAC, no eval workflows, API down) returns [] and
                the caller falls back to the trainer-log grep. Runs where the trigger is off
                (``ARENA_EVAL_TASKS`` unset) simply return [] here too.
                """
                if not job:
                    return []
                try:
                    obj = _k8s_get("/apis/argoproj.io/v1alpha1/namespaces/arena-tasks/workflows")
                except Exception:  # RBAC / API down
                    return []
                prefix = f"{job}-eval-s"
                steps: set[int] = set()
                for item in obj.get("items") or []:
                    name = (item.get("metadata") or {}).get("name") or ""
                    if not name.startswith(prefix):
                        continue
                    m = _EVAL_STEP_RE.search(name)
                    if m:
                        steps.add(int(m.group(1)))
                return sorted(steps)


            def _checkpoint_summary(job: str, ckpt_dir: str) -> dict[str, Any]:
                """Count saved checkpoints for the run (best-effort).

                Preferred source: the AGISlime eval-on-checkpoint trigger's fanned-out
                workflows (see :func:`_eval_trigger_steps`). One workflow per saved
                checkpoint, and they survive trainer pod cleanup — so the final onExit
                render on a bounded-finalize run still reports the real count. On runs where
                the trigger is off or the workflow list is unavailable, fall back to
                greping Megatron's "saving checkpoint at iteration <N>" lines from the
                trainer worker-0 pod log — image-independent, needs only ``pods/log``
                (already granted). ``ckpt_dir`` is passed through for display only.

                ``n`` is the count of distinct saved checkpoints; ``latest`` is the highest.
                """
                result: dict[str, Any] = {"n": 0, "count": "0", "latest": None, "dir": ckpt_dir}
                if not job:
                    return result
                steps = _eval_trigger_steps(job)
                if steps:
                    result.update(n=len(steps), count=str(len(steps)), latest=max(steps))
                    return result
                pod = f"{job}-trainer-worker-0"
                try:
                    log = _k8s_get_text(f"/api/v1/namespaces/arena-tasks/pods/{pod}/log?container=pytorch&limitBytes=4000000")
                except Exception:  # pod gone (post-cleanup) / RBAC / API down
                    return result
                iters = {int(m) for m in _CKPT_SAVE_RE.findall(log)}
                if iters:
                    result.update(n=len(iters), count=str(len(iters)), latest=max(iters))
                return result


            # The Argo controller sets this status.message when a workflow is `argo stop`ped
            # (spec.shutdown=Stop). A run that ends any other way (real crash, deadline) is
            # Failed/Error WITHOUT this marker. Used to split "Stopped" from "Failed".
            _STOP_MARKER = "Stopped with strategy"


            def _workflow_stopped(job: str) -> bool:
                """True iff the workflow was `argo stop`ped (vs. failed on its own).

                Reads the Argo Workflow CR (the runner SA has get/list on workflows). Checks
                spec.shutdown first (set the instant stop is issued) then status.message.
                Best-effort: any failure returns False, so an unreadable CR degrades to
                "Failed" rather than mislabeling a real failure as stopped.
                """
                if not job:
                    return False
                try:
                    obj = _k8s_get(f"/apis/argoproj.io/v1alpha1/namespaces/arena-tasks/workflows/{job}")
                except Exception:  # RBAC / not-found / API down
                    return False
                if (obj.get("spec") or {}).get("shutdown"):
                    return True
                return _STOP_MARKER in ((obj.get("status") or {}).get("message") or "")


            def _gym_rows(gyms_json: str) -> list[dict[str, Any]]:
                """Parse the `gyms` param JSON into report rows (name/dataset/replicas/...)."""
                try:
                    gyms = json.loads(gyms_json) if gyms_json else []
                except json.JSONDecodeError:
                    return []
                default_n = os.environ.get("N_SAMPLES_PER_PROMPT", "")
                return [
                    {
                        "name": g.get("name", "?"),
                        "dataset": g.get("dataset", ""),
                        "replicas": g.get("replicas", 1),
                        "n_samples": g.get("n_samples_per_prompt") or g.get("k_completion") or default_n,
                        "concurrency": g.get("concurrency", 1),
                    }
                    for g in gyms
                ]


            # The W&B run id is an 8-char base-36 token; wandb prints a "View run at
            # .../runs/<id>" line to stdout at init. Match that line rather than any bare
            # token so we don't pick up an unrelated id.
            _WANDB_RUN_LINE = re.compile(r"/runs/([A-Za-z0-9]+)")


            def _run_id_cache_loc() -> tuple[str, str] | None:
                """S3 (bucket, key) for this run's cached W&B run id, or None if unconfigured.

                The cache lives under this run's OWN report scratch (``RUN_PATH``) — not the
                trainer's — so it respects the same "don't read the trainer's files" rule as
                the pod-log grep.
                """
                bucket = os.environ.get("S3_SCRATCH_BUCKET", "")
                run_path = os.environ.get("RUN_PATH", "")
                if not (bucket and run_path):
                    return None
                return bucket, f"{run_path}/wandb_run_id"


            def _run_id_cache_get() -> str:
                """Read the run id cached by an earlier live-pod render (best-effort, else '')."""
                loc = _run_id_cache_loc()
                if loc is None:
                    return ""
                try:
                    import boto3

                    obj = boto3.client("s3").get_object(Bucket=loc[0], Key=loc[1])
                    return obj["Body"].read().decode("utf-8").strip()
                except Exception:  # not cached yet / S3 down / no creds — degrade to project page
                    return ""


            def _run_id_cache_put(run_id: str) -> None:
                """Persist a freshly-grepped run id to this run's own scratch (best-effort)."""
                loc = _run_id_cache_loc()
                if loc is None:
                    return
                try:
                    import boto3

                    boto3.client("s3").put_object(Bucket=loc[0], Key=loc[1], Body=run_id.encode("utf-8"))
                except Exception:  # caching is an optimization; never fail the render
                    return


            def _wandb_run_id(job: str) -> str:
                """The trainer's W&B run id: grepped from its pod log, cached for the final render.

                At init, wandb prints ``View run at <host>/<entity>/<project>/runs/<run-id>``
                to the trainer's stdout; we read that line from worker-0's pod log via the
                K8s API (image-independent, needs only ``pods/log``). We still avoid reading
                any trainer-written file (its scratch layout is owned by a separately-
                versioned image, and S3-Files does not reliably surface another pod's files).

                A live grep is cached to this run's OWN report scratch (``RUN_PATH``) so the
                final ``onExit`` render — which runs after the trainer pod is gone — can
                still deep-link the run instead of falling back to the project page. Returns
                "" only when neither the live grep nor the cache resolves an id.
                """
                if not job:
                    return ""
                # worker-0 is rank 0 — the process that runs wandb.init and prints the line.
                pod = f"{job}-trainer-worker-0"
                try:
                    # Tail a bounded slice: the init line is early, but cap bytes so a long
                    # run's log doesn't balloon the request.
                    log = _k8s_get_text(f"/api/v1/namespaces/arena-tasks/pods/{pod}/log?container=pytorch&limitBytes=2000000")
                except Exception:  # pod not created yet / deleted by cleanup / RBAC / API down
                    log = ""
                # Last match wins: on a resume the newest run id is the live one.
                ids = _WANDB_RUN_LINE.findall(log)
                if ids:
                    _run_id_cache_put(ids[-1])
                    return ids[-1]
                # Pod gone / not logged yet: fall back to the id a live-pod render cached.
                return _run_id_cache_get()


            def _wandb_url(job: str) -> str:
                """Deep-link the exact W&B run when resolvable, else the project page.

                The run URL is precise but needs the runtime run id (see
                :func:`_wandb_run_id`); until that appears, the project page always exists
                and lists the run, so the link is never dead.
                """
                host = os.environ.get("WANDB_HOST", "").rstrip("/")
                entity = os.environ.get("WANDB_ENTITY", "")
                project = os.environ.get("WANDB_PROJECT", "")
                if not (host and entity and project):
                    return ""
                base = f"{host}/{entity}/{project}"
                run_id = _wandb_run_id(job)
                return f"{base}/runs/{run_id}" if run_id else base


            def _trajectories_url(log_dir: str, run_path: str, have_bundle: bool) -> str:
                """Browser link to the trajectories.

                Prefers the bundled Inspect viewer (``inspect_view/index.html`` under the
                run's scratch prefix) — a browsable per-trajectory site built with
                ``inspect view bundle`` (each monitoring heartbeat, and a final finalize-bundle
                step) and pushed to ``s3://.../<run-path>/inspect_view/``. Its browser URL is
                ``.../scratch/<run-path>/inspect_view/index.html``.

                ``have_bundle`` gates the viewer link: a bundle is produced whenever ≥1 .eval
                exists, so the caller passes ``trajectories.n > 0``. (The bundle is written to
                the scratch mount, NOT $RUN_ROOT, to keep the pod EmptyDir flat on long runs —
                so the renderer can't stat it locally.) Falls back to the raw ``.eval`` prefix
                (a valid S3 listing) before the first bundle, and returns "" when nothing is
                persisted yet.
                """
                domain = os.environ.get("DOMAIN", "")
                if not domain:
                    return ""
                if have_bundle and run_path:
                    return f"https://browser.{domain}/scratch/{run_path}/inspect_view/index.html"
                for mount in _SCRATCH_MOUNTS:
                    if log_dir and log_dir.startswith(mount):
                        key = log_dir[len(mount) :].strip("/")
                        return f"https://browser.{domain}/scratch/{key}/"
                return ""


            def main() -> None:
                """Write run-manifest.json, gather live status, then render the report."""
                run_root = os.environ["RUN_ROOT"]

                keys = [
                    "WF_STATUS",
                    "WF_FAILURES",
                    "ARENA_USER",
                    "ARENA_JOB",
                    "MODEL_ARCH",
                    "MODEL_NAME",
                    "N_SAMPLES_PER_PROMPT",
                    "TRAINER_IMAGE",
                    "RUNNER_IMAGE",
                    "WANDB_HOST",
                    "WANDB_ENTITY",
                    "WANDB_PROJECT",
                    "NATS_URL",
                    "INSPECT_LOG_DIR",
                ]
                manifest = {k.lower(): os.environ.get(k, "") for k in keys}
                manifest_path = run_root + "/run-manifest.json"
                with open(manifest_path, "w", encoding="utf-8") as f:
                    json.dump(manifest, f, indent=2, sort_keys=True)
                print(f"wrote {manifest_path}")  # noqa: T201 — pod log

                # Lazy: the manifest above must survive a missing/broken jinja2.
                import jinja2

                job = manifest["arena_job"]
                log_dir = manifest["inspect_log_dir"]
                status = manifest["wf_status"]
                running = status == "Running"
                # Normalize the terminal workflow phase: Argo reports an `argo stop` as
                # "Failed", but that is an operator stop, not a training failure. Map it to
                # "Stopped" when the stop-marker is present so the pill AND the trainer card
                # read Stopped / Failed / Succeeded accurately.
                if status == "Failed" and _workflow_stopped(job):
                    status = "Stopped"
                trainer = _trainer_status(job)
                # On a terminal run (final onExit render), the live PyTorchJob read is
                # unreliable: it may still report "Running" mid-termination, or be already
                # deleted by cleanup. The workflow's terminal status is the truth, so the
                # trainer card must not freeze on a stale "Running".
                if status in _TERMINAL:
                    trainer = {"state": status, "detail": "run ended"}
                gyms = _gym_rows(os.environ.get("GYMS", ""))
                trajectories = _trajectory_summary(log_dir)
                # Checkpoints are shown as two rows in the Run manifest list (count + path),
                # not a metric card — they are reference facts, not a live status tile.
                checkpoints = _checkpoint_summary(job, os.environ.get("CHECKPOINT_DIR", ""))
                manifest["checkpoints_saved"] = checkpoints["count"]
                manifest["checkpoint_path"] = checkpoints["dir"]
                # The bundle script builds inspect_view whenever ≥1 .eval exists, so gate the
                # viewer link on the trajectory count; empty -> no link (raw prefix 404s).
                trajectories_url = _trajectories_url(log_dir, os.environ.get("RUN_PATH", ""), have_bundle=bool(trajectories["n"]))

                env = jinja2.Environment(
                    autoescape=True,
                    block_start_string="[%",
                    block_end_string="%]",
                    variable_start_string="[[",
                    variable_end_string="]]",
                    comment_start_string="[#",
                    comment_end_string="#]",
                )
                with open(_TEMPLATE_PATH, encoding="utf-8") as f:
                    template = env.from_string(f.read())
                display_status = _display_status(status, trainer["state"])
                page = template.render(
                    title=job,
                    cls=_pill_class(display_status),
                    status=display_status,
                    model=manifest["model_name"] or manifest["model_arch"],
                    n_samples_per_prompt=manifest["n_samples_per_prompt"],
                    gym_count=len(gyms),
                    gyms=gyms,
                    trainer=trainer,
                    workers=_worker_pods(job),
                    trajectories=trajectories,
                    wandb_url=_wandb_url(job),
                    trajectories_url=trajectories_url,
                    argo_url=os.environ.get("ARGO_URL", ""),
                    # The heartbeat page self-refreshes; the final render (run stopped) does
                    # not, so a stopped tab stops polling a dead workflow.
                    refresh=os.environ.get("REPORT_REFRESH", "") if running else "",
                    manifest=manifest,
                    generated=datetime.now(UTC).strftime("%Y-%m-%d %H:%M UTC"),
                )
                os.makedirs(run_root + "/dashboard", exist_ok=True)
                out = run_root + "/dashboard/index.html"
                with open(out, "w", encoding="utf-8") as f:
                    f.write(page)
                print(f"wrote {out}")  # noqa: T201 — pod log


            # Terminal states shown verbatim on the pill + trainer card. "Stopped" is the
            # arena label for an `argo stop` (Argo's underlying phase is "Failed"); main()
            # maps it before these run.
            _TERMINAL = ("Succeeded", "Failed", "Error", "Stopped")


            def _display_status(wf_status: str, trainer_state: str) -> str:
                """The status shown on the pill.

                A terminal *workflow* status wins — at ``argo stop`` / completion the
                trainer PyTorchJob can still read "Running" for a moment (or be mid-delete),
                but the run itself is over, so the workflow status is the truth. While the
                workflow is live, the trainer's own state is more informative than the
                always-"Running" workflow phase; fall back to the workflow status when the
                trainer state is unavailable.
                """
                if wf_status in _TERMINAL:
                    return wf_status
                return trainer_state if trainer_state and trainer_state != "unknown" else wf_status


            def _pill_class(status: str) -> str:
                """Map a display status to a status-pill class (ok / bad / run).

                Stopped is a neutral operator action, not a failure — give it the running
                (blue) pill rather than the red `bad` one.
                """
                if status in ("Failed", "Error"):
                    return "bad"
                if status == "Succeeded":
                    return "ok"
                return "run"


            if __name__ == "__main__":
                main()
      - mode: 420
        name: notify-py
        path: /work/notify.py
        raw:
          data: |
            """Slack notification helper for the slime-deployer training report.

            Embedded verbatim (quoted heredoc) into the monitoring + finalize scripts by
            ``slime_deployer_builder`` and run inside the arena-tasks runner image. Sends a
            Slack DM to the run's submitter through the eval team's ``/notify`` API.

            The SigV4 POST body matches AREnAInfraCDK ``resources/lambda/thanatos/index.py``
            ``send_notification`` (the two packages cannot import each other). The ARENA
            account is allowlisted on the Notifier API (NotifierInfraCDK CR-284762163), and
            the ``arena-tasks-runner`` Pod Identity role holds ``execute-api:Invoke`` on the
            ``/notify`` ARN, so this pod's ambient creds sign the request.

            Best-effort: any failure is logged and swallowed. A notification MUST NEVER
            break the report heartbeat or the exit handler.
            """

            from __future__ import annotations

            import json
            import logging
            import os
            import sys

            logger = logging.getLogger("arena.notify")
            if not logger.handlers:
                logging.basicConfig(level=logging.INFO, stream=sys.stderr)


            def send_slack(subject: str, message: str, recipient: str) -> bool:
                """SigV4 POST to the /notify API to Slack-DM ``recipient`` (an alias).

                Returns True iff a DM was dispatched (endpoint set + recipient + 2xx), False
                when skipped or delivery failed. Never raises.
                """
                endpoint = os.environ.get("NOTIFY_ENDPOINT", "")
                region = os.environ.get("NOTIFY_REGION", "us-west-2")
                alias = (recipient or "").strip()
                if not endpoint or not alias:
                    logger.info("notify skipped: endpoint=%r recipient=%r", endpoint, recipient)
                    return False
                try:
                    from urllib.error import HTTPError, URLError
                    from urllib.request import Request, urlopen

                    import boto3
                    from botocore.auth import SigV4Auth
                    from botocore.awsrequest import AWSRequest

                    payload = json.dumps(
                        {
                            "source": "arena-slime-deployer",
                            "subject": subject,
                            "message": message,
                            "recipients": [{"type": "alias", "value": alias, "channels": ["slack"]}],
                        }
                    ).encode()

                    creds = boto3.Session().get_credentials().get_frozen_credentials()
                    signed = AWSRequest(
                        method="POST",
                        url=endpoint,
                        data=payload,
                        headers={"Content-Type": "application/json"},
                    )
                    SigV4Auth(creds, "execute-api", region).add_auth(signed)

                    req = Request(url=endpoint, data=payload, headers=dict(signed.headers), method="POST")
                    try:
                        with urlopen(req, timeout=10) as resp:
                            status = resp.getcode()
                    except HTTPError as http_exc:
                        # API Gateway returns a JSON deny body; log it so a 403 is
                        # self-diagnosing (wrong domain / not allowlisted / missing invoke).
                        body = http_exc.read().decode("utf-8", "replace") if hasattr(http_exc, "read") else ""
                        logger.warning("notify failed (non-fatal): HTTP %s -> %s", http_exc.code, body or "(empty)")
                        return False
                    except URLError as url_exc:
                        logger.warning("notify failed (non-fatal): connection error -> %s", url_exc.reason)
                        return False
                    logger.info("notify -> HTTP %s to %s", status, alias)
                    return True
                except Exception as exc:
                    # Best-effort: a notify error must never break the report heartbeat.
                    logger.warning("notify failed (non-fatal): %s: %s", type(exc).__name__, exc)
                    return False


            if __name__ == "__main__":
                # CLI: notify.py <subject> <message>; recipient from NOTIFY_RECIPIENT env
                # (the submitter's alias). Exit 0 always — a notify failure must not break
                # the calling report script.
                _subject = sys.argv[1] if len(sys.argv) > 1 else ""
                _message = sys.argv[2] if len(sys.argv) > 2 else ""
                send_slack(_subject, _message, os.environ.get("NOTIFY_RECIPIENT", ""))
                sys.exit(0)
      - mode: 420
        name: scripts-lib-notify-sh
        path: /work/lib/notify.sh
        raw:
          data: |
            # Slack notification helpers. Sourcing this file also does the setup it needs:
            # the endpoint and cluster label are stage-specific, so they are derived here from
            # the ConfigMap-provided $DOMAIN rather than baked at build time.
            #
            # The Notifier API is beta-only vs prod-apex: a `.beta.` domain maps to the beta
            # notifier, everything else to the prod apex (see AREnAInfraCDK
            # gpu-job-tracking.notifyApiEndpoint). An empty $DOMAIN disables notifications.
            #
            # NOTIFY_REGION MUST be the Notifier API Gateway's region -- us-west-2 for both
            # stages, per AREnAInfraCDK gpu-job-tracking.NOTIFY_API_REGION -- NOT the infra or
            # scratch region (e.g. ap-south-1), or API Gateway 403s the request with
            # "Credential should be scoped to a valid region".
            #
            # Provides:
            #   notify <subject> <message>   best-effort DM to the submitter; never fails
            #   once <key>                   true exactly once per key, across heartbeats
            case "$DOMAIN" in
              *.beta.*) export NOTIFY_ENDPOINT='https://beta.notifier.agif.amazon.dev/notify' ;;
              '')       export NOTIFY_ENDPOINT='' ;;
              *)        export NOTIFY_ENDPOINT='https://notifier.agif.amazon.dev/notify' ;;
            esac
            export NOTIFY_REGION='us-west-2'
            CLUSTER_LABEL=$(echo "$DOMAIN" | awk -F. '/^v2\./{print $3"-"$2"-v2"}')
            export CLUSTER_LABEL="${CLUSTER_LABEL:-$DOMAIN}"
            [ -n "$DOMAIN" ] && export REPORT_URL="https://browser.${DOMAIN}/scratch/${RUN_PATH}/dashboard/index.html" || export REPORT_URL=""
            notify() {
              NOTIFY_RECIPIENT="${NOTIFY_RECIPIENT:-${ARENA_USER}}" \
              python3.12 "/work/notify.py" "$1" "$2" 2>/dev/null || true
            }
            NOTIFY_SENT_DIR="$RUN_ROOT/.notify"
            mkdir -p "$NOTIFY_SENT_DIR"
            once() {
              if [ -e "$NOTIFY_SENT_DIR/$1" ]; then return 1; fi
              : > "$NOTIFY_SENT_DIR/$1"; return 0
            }
      - mode: 420
        name: scripts-lib-publish-sh
        path: /work/lib/publish.sh
        raw:
          data: |
            # Publishing one heartbeat's output: bundle the trajectories, render the report,
            # push both to scratch. Sourced by the monitoring heartbeat and by both onExit
            # handlers, each of which calls only the parts it needs.

            # Rebuild the browsable Inspect view over the persisted .eval trajectories, so the
            # report's "trajectories" link opens the per-trajectory viewer instead of a raw S3
            # prefix (which the artifact browser cannot render).
            #
            # Throttled: re-bundles only when the .eval count changed. `_bundled_n` persists
            # across heartbeats in this same shell, and is unset on the one-shot finalize run,
            # so that run bundles once.
            #
            # CRITICAL: `inspect view bundle` COPIES every .eval into <output>/logs, so one
            # current-state bundle grows with the trajectory count. It must NOT go to the tiny
            # pod-local $RUN_ROOT EmptyDir -- it eventually exceeds that volume's sizeLimit,
            # the pod is evicted, and the workflow fails (observed at ~3h / 214 trajectories).
            # It also needs a real POSIX filesystem: Mountpoint-S3 (/mnt/scratch-s3-rw) is
            # write-once/no-rename and the S3-Files NFS mount fails the write pattern. So it
            # bundles to $BUNDLE_DIR -- a dedicated, generously sized EmptyDir separate from
            # $RUN_ROOT -- pushes that to S3, then deletes it, keeping the directory bounded to
            # exactly one current bundle rather than N accumulated ones.
            #
            # Best-effort throughout: a bundle failure never breaks the heartbeat, because the
            # renderer gates the viewer link on the trajectory count, not on a local stat.
            # Carries across beats: _bundled_n
            bundle_trajectories() {
              if [ -n "${INSPECT_LOG_DIR:-}" ] && [ -d "${INSPECT_LOG_DIR:-}" ] && [ -n "$S3_SCRATCH_BUCKET" ]; then
                _n=$(find "$INSPECT_LOG_DIR" -name '*.eval' 2>/dev/null | wc -l)
                if [ "$_n" -gt 0 ] && [ "$_n" != "${_bundled_n:-}" ]; then
                  rm -rf "${BUNDLE_DIR}"
                  if inspect view bundle --log-dir "$INSPECT_LOG_DIR" \
                      --output-dir "${BUNDLE_DIR}" 2>/dev/null; then
                    aws s3 sync "${BUNDLE_DIR}" "s3://$S3_SCRATCH_BUCKET/$RUN_PATH/inspect_view" \
                      --region "$AWS_REGION" --delete --no-progress \
                      && _bundled_n="$_n" || echo "inspect_view sync failed (non-fatal)" >&2
                  else
                    echo "inspect view bundle failed (non-fatal)" >&2
                  fi
                  rm -rf "${BUNDLE_DIR}"
                fi
              fi
            }

            # Render the report once from the current environment. ARGO_URL comes from the
            # ConfigMap-provided domain; REPORT_TEMPLATE tells the renderer where its template
            # was staged. Non-fatal: a render failure must not stop the heartbeat.
            render_report() {
              export REPORT_TEMPLATE="/work/report.html.j2"
              [ -n "$DOMAIN" ] && export ARGO_URL="https://argo.${DOMAIN}/workflows/arena-tasks/${ARENA_JOB}" || true
              python3.12 "/work/render_report.py" || echo "report render failed (non-fatal)" >&2
            }

            # Push $RUN_ROOT (the report and its sentinels) to the run's scratch prefix. The
            # inspect_view bundle is NOT under $RUN_ROOT -- bundle_trajectories pushes it from
            # $BUNDLE_DIR directly.
            sync_run_root() {
              aws s3 sync "$RUN_ROOT" "s3://$S3_SCRATCH_BUCKET/$RUN_PATH" \
                --region "$AWS_REGION" --no-progress || echo "report sync failed" >&2
            }
      - mode: 420
        name: scripts-lib-lifecycle-sh
        path: /work/lib/lifecycle.sh
        raw:
          data: |
            # Run lifecycle: the three Slack notifications, and the decision to finalize.
            #
            # Requires notify.sh (notify, once, REPORT_URL, CLUSTER_LABEL).
            #
            # State carried across heartbeats, in the heartbeat shell rather than passed:
            #   _ready_n                 consecutive beats everything has been ready
            #   _trainer_seen _gone_n    whether the trainer was ever observed, and for how
            #                            many consecutive polls it has been missing since

            # Notification 1, on the first heartbeat: the run exists. Says how many nodes were
            # requested and promises a second message when training actually begins.
            notify_run_created() {
              if once created; then
                notify "Training run started: ${ARENA_JOB}" \
              "Requested *${GPU_NODES} ${GPU_LABEL}* nodes on *${CLUSTER_LABEL}*. Waiting for workers to come up -- you will get a second message when training begins."
              fi
            }

            # Notification 2: the run is live. Gated on trainer Running AND every trainer
            # worker Ready AND at least one gym pod, all gym pods Ready, AND at least one
            # .eval published -- held for three consecutive beats so the report's W&B and
            # trajectory links have populated before the reader follows them.
            #
            # Opening the `started` sentinel is also what arms the health monitors, so this
            # has to run before them in the beat.
            notify_run_live() {
              if [ ! -e "$NOTIFY_SENT_DIR/started" ]; then
                _tr=$(kubectl get pytorchjob "${ARENA_JOB}-trainer" -n arena-tasks -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
                _wr=$(kubectl get pods -n arena-tasks -l training.kubeflow.org/job-name=${ARENA_JOB}-trainer -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep -c True || true)
                _gt=$(kubectl get pods -n arena-tasks -l arena.job=${ARENA_JOB},app=arena-gym-worker -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -c . || true)
                _gr=$(kubectl get pods -n arena-tasks -l arena.job=${ARENA_JOB},app=arena-gym-worker -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep -c True || true)
                _ne=$(find "${INSPECT_LOG_DIR:-/nonexistent}" -name "*.eval" 2>/dev/null | grep -c . || true)
                case " $_tr " in *" Running "*) _tr_running=1 ;; *) _tr_running=0 ;; esac
                if [ "$_tr_running" = 1 ] && [ "${_wr:-0}" -ge "${GPU_NODES:-1}" ] && [ "${_gt:-0}" -ge 1 ] && [ "${_gr:-0}" -ge "${_gt:-1}" ] && [ "${_ne:-0}" -ge 1 ]; then
                  _ready_n=$(( ${_ready_n:-0} + 1 ))
                  if [ "$_ready_n" -ge 3 ] && once started; then
                    _msg=$(printf '%s\n%s\n%s' "All workers (trainer + gym) are ready and training has started." "Run report: ${REPORT_URL}" "The report has links to the *Argo workflow*, *W&B run*, and *Trajectories*.")
                    notify "Training is live: ${ARENA_JOB}" "$_msg"
                  fi
                else
                  _ready_n=0
                fi
              fi
            }

            # Notification 3, from the onExit handler: the run ended. Re-derives
            # stopped-vs-failed from the Workflow's spec.shutdown, because Argo reports an
            # `argo stop` as Failed and that is an operator action rather than a training
            # failure. Step and checkpoint counts come from the per-step eval workflows when
            # they exist, and from the trainer log otherwise.
            notify_run_ended() {
              _shutdown=$(kubectl get workflow "${ARENA_JOB}" -n arena-tasks -o jsonpath='{.spec.shutdown}' 2>/dev/null || true)
              case "${WF_STATUS}" in
                Succeeded) _verb="complete"; _emoji="Training complete" ;;
                Failed|Error) if [ -n "$_shutdown" ]; then _emoji="Training stopped"; _verb="stopped by user"; else _emoji="Training failed"; _verb="failed"; fi ;;
                *) _emoji="Training ended"; _verb="${WF_STATUS}" ;;
              esac
              _evsteps=$(kubectl get workflows -n arena-tasks -o name 2>/dev/null | grep -oE "${ARENA_JOB}-eval-s[0-9]+-" | grep -oE "s[0-9]+" | sort -u || true)
              if [ -n "$_evsteps" ]; then
                _ckpt=$(printf '%s\n' "$_evsteps" | grep -c .)
                _step=$(printf '%s\n' "$_evsteps" | grep -oE "[0-9]+" | sort -n | tail -1)
              else
                _log=$(kubectl logs "${ARENA_JOB}-trainer-worker-0" -c pytorch -n arena-tasks --tail=20000 2>/dev/null || true)
                _step=$(printf '%s' "$_log" | grep -oiE "step[[:space:]]+[0-9]+:" | grep -oE "[0-9]+" | sort -n | tail -1 || true)
                _ckpt=$(printf '%s' "$_log" | grep -oiE "saving checkpoint at iteration[[:space:]]+[0-9]+" | grep -oE "[0-9]+$" | sort -un | grep -c . || true)
              fi
              _msg=$(printf '%s\n%s' "Run ${_verb}. Reached *step ${_step:-0}*, *${_ckpt:-0} checkpoint(s)* saved." "Final report: ${REPORT_URL}")
              notify "${_emoji}: ${ARENA_JOB}" "$_msg"
            }

            # End the heartbeat -- and with it the workflow -- once the trainer reaches a
            # terminal state. `exit` here exits the entrypoint's shell, which is the
            # container's process, so this function's exit code becomes the workflow outcome.
            #
            # The "gone" branch covers a trainer deleted out from under us: a transient API
            # failure looks exactly like a 404, so it takes three consecutive misses after the
            # job was actually seen.
            finalize_if_trainer_terminal() {
            _ts=$(kubectl get pytorchjob "${ARENA_JOB}-trainer" -n arena-tasks -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)
            case " $_ts " in
              *" Succeeded "*) echo "trainer Succeeded -- finalizing run."; exit 0 ;;
              *" Failed "*) echo "trainer Failed -- finalizing run."; exit 1 ;;
            esac
            _trainer_exists=$(kubectl get pytorchjob "${ARENA_JOB}-trainer" -n arena-tasks -o name 2>/dev/null || true)
            if [ -n "$_trainer_exists" ]; then _trainer_seen=1; _gone_n=0; fi
            if [ "${_trainer_seen:-0}" = 1 ] && [ -z "$_trainer_exists" ]; then
              _gone_n=$(( ${_gone_n:-0} + 1 ))
              if [ "$_gone_n" -ge 3 ]; then
                echo "trainer PyTorchJob gone for $_gone_n consecutive polls after being seen -- finalizing run."; exit 0
              fi
            fi
            }
      - mode: 420
        name: scripts-finalize-render-sh
        path: /work/finalize_render.sh
        raw:
          data: |
            # onExit, fast path: render the final report and send the terminal notification.
            #
            # Runs BEFORE cleanup, because it greps the trainer-worker-0 log for the W&B run
            # id and the step/checkpoint counts -- all of which need the trainer to still
            # exist. It does not bundle, so it stays fast and cleanup is not held up.
            set -uo pipefail
            mkdir -p "$RUN_ROOT"

            . "/work/lib/notify.sh"
            . "/work/lib/publish.sh"
            . "/work/lib/lifecycle.sh"

            render_report
            sync_run_root
            notify_run_ended
            exit 0
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: 'true'
    name: write-report
    priorityClassName: high
    volumes:
    - emptyDir:
        sizeLimit: 1Gi
      name: workdir
  - container:
      args:
      - /work/finalize_bundle.sh
      command:
      - sh
      env:
      - name: ARENA_USER
        value: '{{workflow.parameters.username}}'
      - name: ARENA_JOB
        value: '{{workflow.name}}'
      - name: RUN_ROOT
        value: /workdir/run
      - name: RUN_PATH
        value: '{{workflow.parameters.username}}/{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.creationTimestamp.d}}/{{workflow.name}}'
      - name: MODEL_ARCH
        value: glm5.3-flash
      - name: MODEL_NAME
        value: policy
      - name: N_SAMPLES_PER_PROMPT
        value: ''
      - name: GYMS
        value: '[{"name":"{{workflow.parameters.gym}}","replicas":{{workflow.parameters.gym-replicas}}}]'
      - name: INSPECT_LOG_DIR
        value: ''
      - name: TRAINER_IMAGE
        value: '{{workflow.parameters.trainer-image}}'
      - name: RUNNER_IMAGE
        value: 427267593057.dkr.ecr.us-east-1.amazonaws.com/arena-tasks:latest
      - name: NATS_URL
        value: nats://{{workflow.name}}-nats-svc:4222
      - name: WANDB_HOST
        value: https://mega.wandb.agi.amazon.dev
      - name: WANDB_ENTITY
        value: arena
      - name: WANDB_PROJECT
        value: arena-rl
      - name: REPORT_REFRESH
        value: '60'
      - name: BUNDLE_DIR
        value: /bundle/inspect_view
      - name: GPU_NODES
        value: '{{workflow.parameters.replicas}}'
      - name: GPU_LABEL
        value: P6
      - name: CHECKPOINT_DIR
        value: /mnt/scratch-s3files-rw/{{workflow.parameters.username}}/checkpoints/slime_experiments/{{workflow.parameters.experiment-name}}
      - name: NOTIFY_RECIPIENT
        value: '{{workflow.parameters.username}}'
      - name: WF_STATUS
        value: '{{workflow.status}}'
      envFrom:
      - configMapRef:
          name: arena-infra-config
      image: 427267593057.dkr.ecr.us-east-1.amazonaws.com/arena-tasks:latest
      imagePullPolicy: Always
      volumeMounts:
      - mountPath: /bundle
        name: bundle
    inputs:
      artifacts:
      - mode: 420
        name: scripts-lib-publish-sh
        path: /work/lib/publish.sh
        raw:
          data: |
            # Publishing one heartbeat's output: bundle the trajectories, render the report,
            # push both to scratch. Sourced by the monitoring heartbeat and by both onExit
            # handlers, each of which calls only the parts it needs.

            # Rebuild the browsable Inspect view over the persisted .eval trajectories, so the
            # report's "trajectories" link opens the per-trajectory viewer instead of a raw S3
            # prefix (which the artifact browser cannot render).
            #
            # Throttled: re-bundles only when the .eval count changed. `_bundled_n` persists
            # across heartbeats in this same shell, and is unset on the one-shot finalize run,
            # so that run bundles once.
            #
            # CRITICAL: `inspect view bundle` COPIES every .eval into <output>/logs, so one
            # current-state bundle grows with the trajectory count. It must NOT go to the tiny
            # pod-local $RUN_ROOT EmptyDir -- it eventually exceeds that volume's sizeLimit,
            # the pod is evicted, and the workflow fails (observed at ~3h / 214 trajectories).
            # It also needs a real POSIX filesystem: Mountpoint-S3 (/mnt/scratch-s3-rw) is
            # write-once/no-rename and the S3-Files NFS mount fails the write pattern. So it
            # bundles to $BUNDLE_DIR -- a dedicated, generously sized EmptyDir separate from
            # $RUN_ROOT -- pushes that to S3, then deletes it, keeping the directory bounded to
            # exactly one current bundle rather than N accumulated ones.
            #
            # Best-effort throughout: a bundle failure never breaks the heartbeat, because the
            # renderer gates the viewer link on the trajectory count, not on a local stat.
            # Carries across beats: _bundled_n
            bundle_trajectories() {
              if [ -n "${INSPECT_LOG_DIR:-}" ] && [ -d "${INSPECT_LOG_DIR:-}" ] && [ -n "$S3_SCRATCH_BUCKET" ]; then
                _n=$(find "$INSPECT_LOG_DIR" -name '*.eval' 2>/dev/null | wc -l)
                if [ "$_n" -gt 0 ] && [ "$_n" != "${_bundled_n:-}" ]; then
                  rm -rf "${BUNDLE_DIR}"
                  if inspect view bundle --log-dir "$INSPECT_LOG_DIR" \
                      --output-dir "${BUNDLE_DIR}" 2>/dev/null; then
                    aws s3 sync "${BUNDLE_DIR}" "s3://$S3_SCRATCH_BUCKET/$RUN_PATH/inspect_view" \
                      --region "$AWS_REGION" --delete --no-progress \
                      && _bundled_n="$_n" || echo "inspect_view sync failed (non-fatal)" >&2
                  else
                    echo "inspect view bundle failed (non-fatal)" >&2
                  fi
                  rm -rf "${BUNDLE_DIR}"
                fi
              fi
            }

            # Render the report once from the current environment. ARGO_URL comes from the
            # ConfigMap-provided domain; REPORT_TEMPLATE tells the renderer where its template
            # was staged. Non-fatal: a render failure must not stop the heartbeat.
            render_report() {
              export REPORT_TEMPLATE="/work/report.html.j2"
              [ -n "$DOMAIN" ] && export ARGO_URL="https://argo.${DOMAIN}/workflows/arena-tasks/${ARENA_JOB}" || true
              python3.12 "/work/render_report.py" || echo "report render failed (non-fatal)" >&2
            }

            # Push $RUN_ROOT (the report and its sentinels) to the run's scratch prefix. The
            # inspect_view bundle is NOT under $RUN_ROOT -- bundle_trajectories pushes it from
            # $BUNDLE_DIR directly.
            sync_run_root() {
              aws s3 sync "$RUN_ROOT" "s3://$S3_SCRATCH_BUCKET/$RUN_PATH" \
                --region "$AWS_REGION" --no-progress || echo "report sync failed" >&2
            }
      - mode: 420
        name: scripts-finalize-bundle-sh
        path: /work/finalize_bundle.sh
        raw:
          data: |
            # onExit, slow path: rebuild the Inspect view bundle and nothing else.
            #
            # Needs nothing from the trainer -- only the .eval logs on the scratch mount -- so
            # it runs in PARALLEL with cleanup and the GPUs are freed without waiting for it.
            # `_bundled_n` is unset in this fresh shell, so bundle_trajectories bundles once.
            set -uo pipefail

            . "/work/lib/publish.sh"

            bundle_trajectories
            exit 0
    name: finalize-bundle
    volumes:
    - emptyDir:
        sizeLimit: 500Gi
      name: bundle
  - container:
      args:
      - /work/render_config.sh
      command:
      - sh
      env:
      - name: MILES_CONFIG
        value: '{{workflow.parameters.miles-config}}'
      - name: EXCLUDED_NODES
        value: '{{workflow.parameters.excluded-nodes}}'
      - name: AGENT_KWARGS
        value: '{{workflow.parameters.agent-kwargs}}'
      - name: WORKFLOW_NAME
        value: '{{workflow.name}}'
      - name: CFG_FILE
        value: miles-config.yaml
      - name: NAMESPACE
        value: arena-tasks
      image: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/os-images:dockerhub-alpine-k8s-1.36.1-260902
    inputs:
      artifacts:
      - mode: 420
        name: miles-scripts-render-config-sh
        path: /work/render_config.sh
        raw:
          data: |
            # Write the operator's `miles-config` parameter into the trainer ConfigMap and
            # publish the node-exclusion count for the trainer `when` gate.
            #
            # The whole config is one raw YAML string (the workflow parameter), so there is
            # nothing to splice: the trainer's launcher reads it as-is from CFG_NAME. Every
            # value arrives as env (MILES_CONFIG, EXCLUDED_NODES, AGENT_KWARGS, CFG_FILE,
            # NAMESPACE, WORKFLOW_NAME), never spliced into this text, so a config line can
            # never be read as shell.
            #
            # AGENT_KWARGS reaches the gym workers as --agent-kwargs. The gym rejects a
            # value that is not a JSON object or that sets a key the trainer task message
            # owns (AREnATasks ADR-0072). The gym starts only after the trainer holds its
            # GPUs, so this step applies the same check first, before anything is created.
            #
            # EXCLUDED_NODES is a JSON list of hostnames. Its raw text must never reach an
            # Argo `when` (quotes and brackets break the expression parser), so the count
            # is emitted as an output parameter and the DAG compares that integer.
            # `jq length` also rejects malformed JSON before any GPU is requested.
            # pipefail: the configmap pipe must fail on `kubectl create`, not only on
            # `kubectl apply`. Both left-hand commands exit 0 on the normal path.
            set -euo pipefail
            if ! printf '%s' "$AGENT_KWARGS" | jq -e 'type == "object" and
              (any(keys[]; . == "max_tokens" or . == "context_limit" or . == "temperature" or . == "top_p") | not)' \
              > /dev/null; then
              echo "agent-kwargs must be a JSON object without max_tokens, context_limit, temperature, or top_p" \
                "(the trainer sends them): $AGENT_KWARGS" >&2
              exit 1
            fi
            printf '%s\n' "$MILES_CONFIG" > /tmp/miles-config.yaml
            kubectl create configmap "${WORKFLOW_NAME}-config" \
              --from-file="${CFG_FILE}=/tmp/miles-config.yaml" \
              -n "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
            printf '%s' "$EXCLUDED_NODES" | jq -e 'if type == "array" then length else error("excluded-nodes must be a JSON list") end' \
              > /tmp/excluded-nodes-count
            echo "excluded-nodes count: $(cat /tmp/excluded-nodes-count)"
    name: render-config
    outputs:
      parameters:
      - name: excluded-nodes-count
        valueFrom:
          path: /tmp/excluded-nodes-count
  - name: nats-service
    resource:
      action: create
      manifest: |
        apiVersion: v1
        kind: Service
        metadata:
          name: "{{workflow.name}}-nats-svc"
          labels:
            arena.job: "{{workflow.name}}"
        spec:
          clusterIP: None
          selector:
            app: nats
            arena.job: "{{workflow.name}}"
          ports:
            - name: nats
              port: 4222
              targetPort: 4222
            - name: monitor
              port: 8222
              targetPort: 8222
      setOwnerReference: true
  - name: nats-deployment
    resource:
      action: create
      manifest: |
        # Single-node JetStream NATS for one miles run. Stream names are
        # per-server, so each run gets its own broker. The Service is the shared
        # tasks/manifests/nats_service.yaml ({{workflow.name}}-nats-svc); its selector
        # is app=nats + arena.job, which the pod labels below satisfy.
        #
        # max_payload 64 MiB bounds one NATS result message. One result carries 8
        # trials x (Vulcan max_compactions, default 4, + 1) segments x up to 131k
        # tokens (gzip); at 8 MiB the broker rejected results and the redelivery loop
        # idled 76% of one run's gym fleet. The trainer's results stream caps one
        # message at 128 MiB (stream_config.RESULTS_MAX_MSG_SIZE) and the stream at
        # 6 GiB (max_bytes), so a 64 MiB message fits both. store_dir on a bounded
        # emptyDir (20Gi) is defense in depth above the results-stream max_bytes
        # bound.
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "{{workflow.name}}-nats"
          labels:
            app: nats
            arena.job: "{{workflow.name}}"
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app: nats
              arena.job: "{{workflow.name}}"
          template:
            metadata:
              labels:
                app: nats
                arena.job: "{{workflow.name}}"
              annotations:
                karpenter.sh/do-not-disrupt: "true"
                cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            spec:
              priorityClassName: high
              nodeSelector:
                node-type: general-cpu
              terminationGracePeriodSeconds: 60
              containers:
                - name: nats
                  image: "339713096311.dkr.ecr.us-east-1.amazonaws.com/agif-base-images-omegat:nats-2.11.3-alpine"
                  command: ["sh", "-c"]
                  args:
                    - |
                      cat > /tmp/nats.conf << 'NATSCONF'
                      port: 4222
                      http_port: 8222
                      max_payload: 67108864
                      jetstream {
                        store_dir: /data/jetstream
                      }
                      NATSCONF
                      exec nats-server -c /tmp/nats.conf
                  ports:
                    - containerPort: 4222
                      name: nats
                    - containerPort: 8222
                      name: monitor
                  readinessProbe:
                    httpGet:
                      path: /healthz?js-server-only=true
                      port: monitor
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    failureThreshold: 6
                  resources:
                    requests:
                      cpu: "1"
                      memory: 2Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  volumeMounts:
                    - mountPath: /data/jetstream
                      name: jetstream
              volumes:
                - name: jetstream
                  emptyDir:
                    sizeLimit: 20Gi
      setOwnerReference: true
      successCondition: status.availableReplicas == 1
  - name: deploy-nats
    steps:
    - - name: service
        template: nats-service
    - - name: deployment
        template: nats-deployment
  - container:
      args:
      - |
        until wget -qO- http://{{workflow.name}}-nats-svc:8222/healthz 2>/dev/null; do
          echo 'Waiting for NATS...'
          sleep 5
        done
        echo 'NATS ready'
      command:
      - sh
      - -c
      image: 339713096311.dkr.ecr.us-east-1.amazonaws.com/agif-base-images-omegat:nats-2.11.3-alpine
    name: wait-nats-ready
  - name: deploy-sglang-svc
    resource:
      action: create
      manifest: |
        # SGLang router Service for the miles trainer: the router binds on the Ray head
        # (replica-index 0, pin_rollout_manager_to_head in the miles config). The gym
        # workers resolve this name; without it every model call fails on DNS
        # (one hand launch dropped 1350 groups in 10 min).
        apiVersion: v1
        kind: Service
        metadata:
          name: "{{workflow.name}}-sglang"
          labels:
            app: sglang-router
            arena.job: "{{workflow.name}}"
        spec:
          type: ClusterIP
          selector:
            training.kubeflow.org/job-name: "{{workflow.name}}-trainer"
            training.kubeflow.org/replica-index: "0"
          ports:
            - name: http
              port: 30000
              targetPort: 30000
      setOwnerReference: true
  - name: deploy-trainer
    resource:
      action: create
      manifest: |
        # The miles trainer PyTorchJob, submitted by the
        # deploy-trainer step. Every replica runs scripts/run_arena_harbor.py; replica
        # index 0 is the Ray head (train role) and hosts the SGLang router, the rest
        # join the Ray cluster (worker role).
        #
        # Three kinds of value here are NOT literal:
        #   workflow tags  double-brace Argo references, substituted at submit time (int fields stay bare).
        #   build-time slots (at-sign delimited) filled from the chart by render_script.
        #   ${VAR}          a real shell variable, expanded inside the container.
        #
        # This file goes through render_script (text), not render_manifest (parsed):
        # `replicas: {{workflow.parameters.replicas}}` must reach Argo unquoted so the
        # API server receives an int32, and a YAML round trip would quote it.
        # NO platform PVC volumes are declared (Kyverno forbids them); /mnt/models-ro,
        # /mnt/scratch-s3files-rw and /mnt/scratch-fast-1a-rw are platform-injected.
        apiVersion: kubeflow.org/v1
        kind: PyTorchJob
        metadata:
          name: "{{workflow.name}}-trainer"
          labels:
            app: "{{workflow.name}}"
            arena.job: "{{workflow.name}}"
            kueue.x-k8s.io/queue-name: "gpu.p6-b200-48xlarge"
            # inference=1000 is the highest WorkloadPriorityClass on the cluster; the
            # pods already get it via priorityClassName high, this makes it visible on
            # the Workload.
            kueue.x-k8s.io/priority-class: inference
        spec:
          elasticPolicy:
            minReplicas: {{workflow.parameters.replicas}}
            maxReplicas: {{workflow.parameters.replicas}}
            # 0 restarts / Never: the known-good arena configuration. A failed run is
            # relaunched with the SAME experiment-name and resumes from --load = --save.
            maxRestarts: 0
            nProcPerNode: 8
            rdzvBackend: c10d
            rdzvId: "{{workflow.name}}-trainer"
          pytorchReplicaSpecs:
            Worker:
              replicas: {{workflow.parameters.replicas}}
              restartPolicy: Never
              template:
                metadata:
                  labels:
                    app: "{{workflow.name}}"
                    arena.job: "{{workflow.name}}"
                  annotations:
                    karpenter.sh/do-not-disrupt: "true"
                spec:
                  serviceAccountName: "arena-tasks-runner"
                  enableServiceLinks: false
                  priorityClassName: high
                  nodeSelector:
                    node-type: "p6-gpu"
                    node.kubernetes.io/instance-type: "p6-b200.48xlarge"

                  tolerations:
                  - effect: NoSchedule
                    key: nvidia.com/gpu
                    operator: Exists
                  - effect: NoSchedule
                    key: vpc.amazonaws.com/efa
                    operator: Exists
                  containers:
                  - name: pytorch
                    image: "{{workflow.parameters.trainer-image}}"
                    imagePullPolicy: Always
                    command: ["bash", "-c"]
                    args:
                    - |
                      mkdir -p /mnt/scratch-s3files-rw/${USER}/logs/${EXPERIMENT_NAME} && ulimit -n 1000000
                      # Kernel JIT caches on LOCAL disk only: on EFS, 8 ranks per node race on
                      # the same NFS cache files and Triton's autotuner dies with ESTALE.
                      export KCACHE=/tmp/kernel_cache
                      export TILELANG_CACHE_DIR=${KCACHE}/tilelang TRITON_CACHE_DIR=${KCACHE}/triton TORCHINDUCTOR_CACHE_DIR=${KCACHE}/inductor
                      mkdir -p ${TILELANG_CACHE_DIR} ${TRITON_CACHE_DIR} ${TORCHINDUCTOR_CACHE_DIR}
                      # In-pod host-memory sampler (60 s) -> memsample-<idx>.log: node meminfo,
                      # own cgroup, /dev/shm, and the RSS of every sglang scheduler / actor
                      # process. node_used - cgroup_used over time attributes co-tenant growth.
                      ( CG=/sys/fs/cgroup$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup); [ -f "$CG/memory.current" ] || CG=/sys/fs/cgroup
                        while sleep 60; do
                          echo "== $(date -u +%FT%TZ)"
                          grep -E '^(MemTotal|MemAvailable|Shmem|AnonPages|Unevictable|SUnreclaim|Cached):' /proc/meminfo
                          echo "cgroup $CG current=$(cat $CG/memory.current 2>&1) max=$(cat $CG/memory.max 2>&1)"
                          grep -E '^(anon|file|shmem|kernel|slab) ' $CG/memory.stat 2>/dev/null
                          df -k /dev/shm | tail -1
                          for p in $(pgrep -f 'sglang::scheduler|MegatronTrainRayActor|SGLangEngine' 2>/dev/null); do
