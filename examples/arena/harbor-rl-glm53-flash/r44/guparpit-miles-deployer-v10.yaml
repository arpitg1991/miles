                --line-2:#313140; --accent:#8b85f5; --accent-ink:#a9a4f8; --good:#34d399;
                --good-bg:#07271d; --bad:#f87171; --bad-bg:#2a1212; --code:#1b1b22;
                --header-bg:rgba(11,11,15,.72);
                --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5); }
            }
