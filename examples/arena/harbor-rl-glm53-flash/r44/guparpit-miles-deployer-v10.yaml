            <script>
            (function () {
              var media = null;
              try { media = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) {}
              function systemTheme() {
                return media && media.matches ? "dark" : "light";
              }
              function savedTheme() {
                try {
                  var t = localStorage.getItem("arena-theme");
                  return t === "dark" || t === "light" ? t : "";
                } catch (e) {
                  return "";
                }
              }
              function applyTheme(t) {
                document.documentElement.setAttribute("data-theme", t || systemTheme());
              }
              window.toggleTheme = function () {
                var next = document.documentElement.getAttribute("data-theme") === "dark"
                  ? "light" : "dark";
                if (next === systemTheme()) {
                  applyTheme("");
                  try { localStorage.removeItem("arena-theme"); } catch (e) {}
                } else {
                  applyTheme(next);
                  try { localStorage.setItem("arena-theme", next); } catch (e) {}
                }
              };
              function onSystemThemeChange() {
                var theme = savedTheme();
                if (!theme || theme === systemTheme()) {
                  try { localStorage.removeItem("arena-theme"); } catch (e) {}
                  applyTheme("");
                }
              }
              try {
                if (media && media.addEventListener) media.addEventListener("change", onSystemThemeChange);
                else if (media && media.addListener) media.addListener(onSystemThemeChange);
              } catch (e) {}
            })();
            </script>
