# Final-v7: 110 selected chains; fresh base start; r20; 16 trainer + 48 engine nodes.
prefetch_rollout_data: true
user: acuadron
cluster: bom
experiment_name: acuadron-agentic-debt-final-v10
project_name: acuadron-agentic-debt-final-v10
agislime_dir: /root/miles
replicas: 64  # final-v10: 16 actor (DP 4) + 48 engines
num_trainers: 16
model_arch: glm5.3-flash
hf_checkpoint: /mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16
ref_load: /mnt/scratch-s3files-rw/guparpit/checkpoints/dcp/glm5.3-flash_torch_dist
save_interval: 10
no_load_optim: true
no_save_optim: true
rollout_function_path: miles_plugins.arena.nats_arena.nats_rollout.NatsRolloutFn  # the class seam max_weight_staleness needs (ADR-0019)
data_source_path: miles_plugins.arena.nats_arena.data_source.ArenaDataSourceWithBuffer
prompt-data-list: '[{"path": "lakefs://arena-inspect/f75dbe74c8e33cf6ce5ad9a46b15f66b3a7339f8c3f01e5997cc972859161684/internal/agentic-debt-r3/acuadron-agentic-debt-final-110-sd015-20261006/manifest.jsonl", "gym_name": "agentic-debt", "weight": 1.0}]'
sglang_disable_overlap_schedule: false
pin_rollout_manager_to_head: true
input_key: messages
metadata_key: metadata
apply_chat_template: false
rollout_shuffle: true
rollout_skip_special_tokens: true
num_rollout: 300
rollout_batch_size: 64
n_samples_per_prompt: 8
rollout_max_response_len: 16384
rollout_temperature: 1
global_batch_size: 512
balance_data: true
rollout_num_gpus_per_engine: 8
sglang_tp_size: 8
sglang_ep_size: 8
sglang_dp_size: 1
rollout_max_context_len: 131072
sglang_context_length: 131072
sglang_chunked_prefill_size: 8192
sglang_disable_radix_cache: false
sglang_dsa_prefill_backend: trtllm
sglang_dsa_decode_backend: trtllm
sglang_kv_cache_dtype: bfloat16
sglang_mem_fraction_static: 0.7
sglang_router_port: 30000
router_health_success_threshold: 1
router_health_check_interval_secs: 15
router_health_failure_threshold: 40
update_weights_interval: 1
partial_rollout: true
gym_autoscale: false
skip_eval_before_train: true
distributed_timeout_minutes: 60
rollout_health_check_interval: 300
rollout_health_check_timeout: 900
use_fault_tolerance: true
tensor_model_parallel_size: 8
sequence_parallel: true
pipeline_model_parallel_size: 4
decoder_first_pipeline_num_layers: 12
decoder_last_pipeline_num_layers: 11
context_parallel_size: 1
expert_model_parallel_size: 8
expert_tensor_parallel_size: 1
glm5_next_kda_tp: true
glm5_next_dsa_qp: true
recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
micro_batch_size: 1
use_dynamic_batch_size: true
max_tokens_per_gpu: 8192
data_pad_size_multiplier: 512
attention_dropout: 0.0
hidden_dropout: 0.0
accumulate_allreduce_grads_in_fp32: true
attention_softmax_in_fp32: true
update_weight_buffer_size: 1073741824
train_memory_margin_bytes: 3221225472
qkv_format: thd
model_name: glm5_next
check_weight_update_equal: false
advantage_estimator: grpo
use_rollout_logprobs: false
use_tis: true
tis_clip: 2.0
use_rollout_routing_replay: true
tis_clip_low: 0.0
keep_old_actor: false
kl_coef: 0.0
kl_loss_coef: 0.0
entropy_coef: 0.0
eps_clip: 0.2
eps_clip_high: 0.28
eps_clip_c: 2.0
optimizer: adam
lr: 1.5e-6  # final-v9 2026-10-07: 1e-5 -> 1.5e-6 after the final-v8 length explosion (tokens/episode 66k -> 938k by rollout 6)
lr_decay_style: constant
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.98
use_distributed_optimizer: true
optimizer_cpu_offload: true
overlap_cpu_optimizer_d2h_h2d: true
use_precision_aware_optimizer: true
use_tensorboard: false
use_wandb: true
use_distributed_post: true
arena_sample_mode: full_trajectory
arena_inflight_multiplier: 8  # final-v10: 512 groups in flight; raise with engine speed (throughput = in-flight / episode latency)
arena_train_segments: all
log_passrate: false
wandb_host: https://mega.wandb.agi.amazon.dev
wandb_project: agentic-debt
disable_wandb_random_suffix: true
wandb_team: arena
wandb_always_use_train_step: false
dynamic_sampling_filter_path: miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std
arena_sample_summary_dir: /mnt/scratch-s3files-rw/acuadron/debug/acuadron-agentic-debt-final-v10/sample_summary
arena_length_reward_coef: 0
skip_actor_forward_only: true
sglang_moe_runner_backend: flashinfer_cutlass
sglang_enable_flashinfer_allreduce_fusion: true
sglang_speculative_algorithm: NEXTN
sglang_speculative_num_steps: 3
sglang_speculative_eagle_topk: 1
sglang_speculative_num_draft_tokens: 4
sglang_load_format: dummy  # r22 relaunch: the trainer's initial push fills the engine weights
sglang_speculative_draft_model_path: /mnt/scratch-fast-1a-rw/acuadron/models/GLM-5.3-Flash-BF16-nextn  # MTP layer only
sglang_speculative_draft_load_format: auto  # the draft loads from disk; without this it takes the dummy load format
max_weight_staleness: 16  # final-v10: about 2x the mean staleness at a 13-min step
calculate_per_token_loss: true  # final-v10: token-level loss average (v23); the per-sample mean grew v9's turn count 2x
disable_grpo_std_normalization: true  # final-v10: v23's setting; no 1/std amplification of near-tied groups
arena_routing_workers: 16  # r24: parallel drain-time routing loads (the default)
