    - name: miles-config
      value: "# guparpit-auctioneer-v1 deltas vs r44 resume 1 (prepared 2026-10-04): a fresh\n# auctioneer run on the r52/r53 trainer stack. The gym side and the dataset\n# are r44 resume 1 (r44/miles-config.yaml and r44/workflow-resume1.yaml on\n# arpit-glm-53): caponly-1034 on lakeFS branch dev (the manifest rows pin\n# commit e5ef91b0), gym auctioneer-caponly, gym image\n# gym-glm53-adr72-20260927a, gym-replicas 288, ack-wait 36000,\n# agent-timeout-multiplier 2, trainer-task-deadline-secs 39600, agent-kwargs\n# {}, publish-jobs-dir '', replicas 16 (8 actor nodes and 8 SGLang engines),\n# arena_inflight_multiplier 4, rollout_max_response_len 16384, window 131072,\n# radix cache and overlap schedule on, n_samples_per_prompt 8,\n# global_batch_size 256, num_rollout 300.\n# The trainer side is guparpit-agentic-debt-v7 (r54): image\n# miles-glm53-recon-20261002-flashmla-evfix (miles 0ffc4044ec, branch\n# arpit-r52-flashmla), expert_model_parallel_size 16 -> 8, glm5_next_kda_tp\n# true, skip_actor_forward_only true, miles_dsa_sparse_attention_forward_backend\n# flash_mla, sglang_moe_runner_backend triton (routing replay needs the\n# materialized top-k ids; the SM100 default resolves to a fused runner),\n# calculate_per_token_loss true, disable_grpo_std_normalization true,\n# arena_length_reward_coef 0.0. Unchanged against r44: TP 8 with sequence\n# parallel, PP 4 with the 11/11/11/12 split, use_rollout_routing_replay,\n# use_tis, lr 1.5e-6, save_interval 10, no_load_optim.\n# Batch shape: rollout_batch_size 64 -> 32. skip_actor_forward_only requires\n# global_batch_size == rollout_batch_size x n_samples_per_prompt\n# (miles/utils/arguments.py, validate_skip_actor_forward_only). r44 ran\n# 64 x 8 = 512 samples per rollout over two optimizer steps of 256. This run\n# keeps the 256-sample optimizer step and takes one step per rollout, as\n# guparpit-cadgym-v1 and guparpit-agentic-debt-v7 do. The in-image parse of\n# the r44 shape fails that assertion (RECORD.md, Checks done before launch).\n# Fresh start: no slime_experiments/guparpit-auctioneer-v1 prefix exists (S3\n# read 2026-10-04), so the trainer loads ref_load (the base DCP) and rollout\n# ids start at 0. W&B project auctioneer (user naming rule 2026-09-30); run\n# name and group guparpit-auctioneer-v1 (disable_wandb_random_suffix).\nuser: guparpit\ncluster: bom\nexperiment_name: guparpit-auctioneer-v1\nproject_name: guparpit-auctioneer-v1\nagislime_dir: /root/miles\nreplicas: 16\nnum_trainers: 8\nmodel_arch: glm5.3-flash\nhf_checkpoint: /mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16\nref_load: /mnt/scratch-s3files-rw/guparpit/checkpoints/dcp/glm5.3-flash_torch_dist\nsave_interval: 10\nno_load_optim: true\nno_save_optim: true\nrollout_function_path: miles_plugins.arena.nats_arena.nats_rollout.generate_rollout\ndata_source_path: miles_plugins.arena.nats_arena.data_source.ArenaDataSourceWithBuffer\nprompt-data-list: '[{\"path\":\"lakefs://arena-inspect/dev/internal/auctioneer/caponly/caponly-1034/manifest.jsonl\",\"gym_name\":\"auctioneer-caponly\",\"weight\":1.0}]'\nsglang_disable_overlap_schedule: false\npin_rollout_manager_to_head: true\ninput_key: messages\nmetadata_key: metadata\napply_chat_template: false\nrollout_shuffle: true\nrollout_skip_special_tokens: true\nnum_rollout: 300\nrollout_batch_size: 32  # guparpit-auctioneer-v1: 64 -> 32; skip_actor_forward_only needs 256 = 32 x 8 (header)\nn_samples_per_prompt: 8\nrollout_max_response_len: 16384\nrollout_temperature: 1\nglobal_batch_size: 256\nbalance_data: true\nrollout_num_gpus_per_engine: 8\nsglang_tp_size: 8\nsglang_ep_size: 8\nsglang_dp_size: 1\nrollout_max_context_len: 131072\nsglang_context_length: 131072\nsglang_chunked_prefill_size: 8192\nsglang_disable_radix_cache: false\nsglang_dsa_prefill_backend: tilelang\nsglang_dsa_decode_backend: tilelang\nsglang_kv_cache_dtype: bfloat16\nsglang_moe_runner_backend: triton  # R3 on the new SGLang: scripts/run_glm5_3_flash.py forces triton for routing replay\nsglang_mem_fraction_static: 0.7\nsglang_router_port: 30000\nrouter_health_success_threshold: 1\nrouter_health_check_interval_secs: 15\nrouter_health_failure_threshold: 40\nupdate_weights_interval: 1\npartial_rollout: true\ngym_autoscale: false\nskip_eval_before_train: true\ndistributed_timeout_minutes: 60\nrollout_health_check_interval: 300\nrollout_health_check_timeout: 900\nuse_fault_tolerance: true\ntensor_model_parallel_size: 8\nsequence_parallel: true\npipeline_model_parallel_size: 4\ndecoder_first_pipeline_num_layers: 11\ndecoder_last_pipeline_num_layers: 12\ncontext_parallel_size: 1\nexpert_model_parallel_size: 8  # r44 ran 16; EP8 is the r50/r52 arm (-13.4% step, peak 109.7 GiB per GPU)\nexpert_tensor_parallel_size: 1\nglm5_next_kda_tp: true\nmiles_dsa_sparse_attention_forward_backend: flash_mla\nrecompute_granularity: full\nrecompute_method: uniform\nrecompute_num_layers: 1\nmicro_batch_size: 1\nuse_dynamic_batch_size: true\nmax_tokens_per_gpu: 8192\ndata_pad_size_multiplier: 512\nattention_dropout: 0.0\nhidden_dropout: 0.0\naccumulate_allreduce_grads_in_fp32: true\nattention_softmax_in_fp32: true\nupdate_weight_buffer_size: 1073741824\ntrain_memory_margin_bytes: 3221225472\nqkv_format: thd\nmodel_name: glm5_next\ncheck_weight_update_equal: false\nadvantage_estimator: grpo\nuse_rollout_logprobs: false\nuse_tis: true\ntis_clip: 2.0\nuse_rollout_routing_replay: true\ntis_clip_low: 0.0\nkeep_old_actor: false\nkl_coef: 0.0\nkl_loss_coef: 0.0\nentropy_coef: 0.0\neps_clip: 0.2\neps_clip_high: 0.28\neps_clip_c: 2.0\noptimizer: adam\nlr: 1.5e-6\nlr_decay_style: constant\nweight_decay: 0.1\nadam_beta1: 0.9\nadam_beta2: 0.98\nuse_distributed_optimizer: true\noptimizer_cpu_offload: true\noverlap_cpu_optimizer_d2h_h2d: true\nuse_precision_aware_optimizer: true\nuse_tensorboard: false\nuse_wandb: true\nuse_distributed_post: true\narena_sample_mode: full_trajectory\narena_inflight_multiplier: 4  # r44 value; a chain holds a worker for up to 5 segments\narena_train_segments: all\nlog_passrate: false\nwandb_host: https://mega.wandb.agi.amazon.dev\nwandb_project: auctioneer  # user naming rule 2026-09-30: the W&B project is the gym name\ndisable_wandb_random_suffix: true\nwandb_team: arena\nwandb_always_use_train_step: false\ndynamic_sampling_filter_path: miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std\narena_sample_summary_dir: /mnt/scratch-s3files-rw/guparpit/debug/guparpit-auctioneer-v1/sample_summary\narena_length_reward_coef: 0.0  # off, as r44 (0) and r53/v7 (memory length-bonus-tied-group-do-less)\ncalculate_per_token_loss: true\ndisable_grpo_std_normalization: true\nskip_actor_forward_only: true\n"
