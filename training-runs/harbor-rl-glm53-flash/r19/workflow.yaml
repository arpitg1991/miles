# Argo Workflow for r19: submitted with `kubectl create -f r19/workflow.yaml`.
# Template: the user-owned copy of the AREnATasksApps arena-miles-deployer
# chart (ADR-0008, fix df26b80) installed as guparpit-miles-deployer. Resource
# names derive from the generated workflow name (rl-glm53f19-xxxxx-trainer,
# -nats, -sglang, -gym-sgb, -config); the checkpoint dir, W&B group and log
# dir derive from experiment-name. Generated from r19/trainer-pytorchjob.yaml
# (trainer-image, excluded-nodes) and r19/miles-config.yaml (verbatim).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: rl-glm53f19-
  namespace: arena-tasks
  labels:
    arena.agif.amazon.dev/submitter: guparpit
spec:
  workflowTemplateRef:
    name: guparpit-miles-deployer
  arguments:
    parameters:
    - name: username
      value: guparpit
    - name: experiment-name
      value: rl-glm53f-gbash-r19
    - name: trainer-image
      value: 427267593057.dkr.ecr.ap-south-1.amazonaws.com/arena-slime-dev:miles-glm53-r3-20260911b
    - name: replicas
      value: '40'
    - name: replica-trainer
      value: '8'
    - name: gym-replicas
      value: '288'
    - name: excluded-nodes
      value: '["i-0161b51ba3f04dc21","i-095b374aee2064004","i-0f2f7d13b4d31644d","i-03d44cd5391d8deb2","i-02f0a3f695e8c55e2","i-00cb6ebceda36a4ef","i-09913cb3a1edcc270","i-08c9e00e2a0af830a","i-04c8462a637bbf738","i-0b682ed36335c009e","i-013fc7dd2474d906f","i-00d391ae8df01e11d","i-08b45d327ad2ebcd3","i-0776ac9db7053a6cf","i-0ffd7cdf3c949b891","i-0e2240450e1459839","i-0575f86280c002502","i-08cda37116a8f5b85","i-0e7902b4e3d9f2d0c","i-04f9a44ac50ae500d","i-0e64a05a2287ddd6f","i-089c3bbbf596a26cb"]'
    - name: miles-config
      value: "# snorkel-general-bash-harbor RL: GLM-5.3-Flash (321B total / 18B active) GRPO\n# on the Harbor NATS gym worker, prod-bom, 12x p6-b200.48xlarge \u2014 derived from\n# examples/arena/harbor-rl-27b-snorkel/snorkel-27b.yaml (arena wiring, batch\n# shape, GRPO block kept r5-faithful) with the model-bound blocks swapped in\n# from the upstream-validated GLM-5.3-Flash recipe\n# (radixark/miles PR #2786, scripts/run_glm5_3_flash.py, shape (8,4)):\n#   workers 0-7  = Megatron actor (64 GPUs: TP8+SP x PP4 [11/11/11/12 layers]\n#                  x CP1, EP16/ETP1, DP=2)\n#   workers 8-39 = SGLang engines (256 GPUs, 32 engines at TP8/EP8; r10, r6 ran 16)\n#\n# r19 deltas vs r18 (2026-09-11): trainer image miles-glm53-r3-20260911b\n# (arpit-glm-53 09f477834, adds --arena-skip-prompt-above-reward), node split\n# back to the r16 shape 8 actor + 32 engine (REPLICA_TRAINER 8, DP=2),\n# prompt-data-list -> the skip1000 manifest (curriculum rows 1001..2922, 1922\n# prompts; r18 consumed 31 steps x 64 = 1984 prompts of the easiest-first\n# order, so r19 starts past the easiest tier), and\n# arena_skip_prompt_above_reward: 0.5 (from epoch 1 on, drop prompts the\n# policy already solves with mean reward > 0.5). Fresh run: no checkpoint dir\n# under slime_experiments/rl-glm53f-gbash-r19. Kept from r18: use_tis true,\n# use_rollout_logprobs false, rollout_shuffle false, lr 1e-6. Launched through\n# the Argo guparpit-miles-deployer WorkflowTemplate (r19/workflow.yaml).\n# r18 deltas vs r17 (2026-09-10): use_tis true, use_rollout_logprobs false\n# (back to the r16 values). r17 step 15 logged train/ppo_kl 0.0062 and\n# pg_clipfrac 2% with the SGLang rollout logprobs as old_log_probs; r16 under\n# R3 with the trainer log_probs pass logged ppo_kl 1.8e-5. The rollout\n# logprobs are not the trainer's, so the extra forward pass is load-bearing.\n# Fresh run: no warm-start symlink under slime_experiments/rl-glm53f-gbash-r19.\n# Kept from r17: curriculum manifest + rollout_shuffle false, node split\n# 16 + 24 (trainer-pytorchjob.yaml), lr 1e-6. Launched through the Argo\n# arena-miles-deployer template (AREnATasksApps ADR-0008; see BUILD.md).\n# r17 deltas vs r16 (2026-09-10): use_tis false, use_rollout_logprobs true,\n# curriculum manifest + rollout_shuffle false; node split moves to 16 + 24\n# (trainer-pytorchjob.yaml). lr stays 1e-6.\n# r16 deltas vs r15 (2026-09-09): use_rollout_routing_replay: true (R3, miles\n# arena ADR-0012). REQUIRES a trainer image with the T1-T3 NATS changes\n# (message_format.py capture_routed_experts, nats_rollout.py drain-time\n# materialization, routing_replay.py) and a gym image with the G1-G3 changes\n# (AREnATasks ADR-0049: per-segment routing snapshot, routed_experts_ref on\n# the shared mount, ARENA_ROUTING_DIR). On an older trainer image the strict\n# argparse still accepts the flag (upstream miles defines it) but every\n# trainable sample then fails with RoutingReplayError at conversion time.\n# Everything else is r15: TIS (eps 0.2/0.28, tis_clip 2.0), 40 replicas,\n# GBS 512, rollout_batch_size 64, n_samples_per_prompt 8,\n# arena_train_segments all, context lengths, radix cache and DSA settings.\n#\n# r12 deltas vs r11 (2026-09-08): arena_train_segments: all (miles arena\n# ADR-0011; REQUIRES image miles-glm53-20260908a, arpit-glm-53 d28503cf). The\n# gym moves to the Vulcan agent with context compaction (AREnATasks ADR-0048,\n# image gym-glm53-vulcan-20260908a, ARENA_COMPACTION_MAX=2; r13/gym-worker.yaml).\n# Each compaction starts a new rollout segment and the gym ships one step per\n# segment; `all` trains every segment as its own Sample with a shared\n# rollout_id and the episode reward. Everything else is r11: 40 replicas,\n# GBS 512, rollout_batch_size 64, n_samples_per_prompt 8,\n# arena_inflight_multiplier 4, save_interval 5, rollout_max_response_len\n# 32768, context lengths, radix cache and DSA settings.\n#\n# r11 deltas vs r10 (2026-09-07): rollout_max_response_len 8192 -> 32768\n# (back to r9; the 8192 per-turn cap cut thinking short), publisher in-flight\n# cap 2x -> 4x rollout_batch_size (arena_inflight_multiplier: 4; r10's 32\n# engines idled at KV ~0.83 with an empty queue), save_interval 20 -> 5 (r10\n# lost 3 steps x ~3 h to a node fabric fault with no checkpoint). Cluster\n# shape (40 replicas = 8 actor + 32 engine nodes), batch shape, context\n# lengths, radix cache and DSA settings are unchanged from r10.\n# The upstream recipe ran COLOCATED (--colocate --offload-train-target disk);\n# this job is DISAGGREGATED like every arena harbor-rl run, so the\n# colocate/offload flags are deliberately NOT carried over.\n#\n# Converted to a flat train argv by scripts/run_arena_harbor.py with\n# hydra_converter semantics (true -> bare flag, false/None -> dropped,\n# prompt-data-list -> --prompt-data moved last, 1e-6 -> 1e-06). The launcher\n# consumes user/cluster/experiment_name/project_name/agislime_dir/replicas/\n# num_trainers/model_arch \u2014 they never reach the trainer (miles argparse is\n# strict). Run identity (checkpoint dir, wandb group) comes from the\n# EXPERIMENT_NAME pod env (ADR-0004), and cluster shape from\n# REPLICA/REPLICA_TRAINER \u2014 the values here are the config-side record.\n#\n# Deltas vs the snorkel-27b.yaml parent (full table: README.md):\n#   - model_arch/hf_checkpoint/ref_load -> GLM-5.3-Flash-BF16 + its converted\n#     torch_dist checkpoint (convert-job.yaml writes it)\n#   - parallelism/perf/optimizer/sglang blocks -> upstream GLM recipe values\n#   - loss_mask_type: qwen3_5 REMOVED (see comment below)\n#   - attention_backend: flash REMOVED \u2014 GLM-5.3-Flash uses its own KDA/DSA\n#     spec (miles_plugins.models.glm5_next); the recipe sets no attention\n#     backend and forcing flash would fight the custom layers\n#   - sglang_enable_dp_attention REMOVED (qwen-specific; recipe runs dp_size 1)\n#   - sglang_tool_call_parser/sglang_reasoning_parser (qwen3_coder/qwen3)\n#     REMOVED \u2014 qwen-specific values would be wrong for GLM; the snorkel\n#     textual bash agent parses tool calls itself, so no parser is configured.\n#     UNVERIFIED for GLM output format \u2014 see README.md \"Risks\".\nuser: guparpit\ncluster: bom\n# EXPERIMENT_NAME in the PyTorchJob pod env drives CKPT_DIR; these names are\n# the config-side record. NEVER reuse a finished run's name (silent resume).\nexperiment_name: rl-glm53f-gbash-r19\nproject_name: rl-glm53f-gbash-r19\nagislime_dir: /root/miles\n# r6: 24 replicas = 8 actor nodes + 16 engine nodes (r1-r5: 12 = 8 + 4) (same convention as the parent:\n# replicas - num_trainers = rollout nodes; the launcher derives\n# --actor-num-nodes 8 and --rollout-num-gpus 128 from these + the pod env)\nreplicas: 40\nnum_trainers: 8\n# -> scripts/models/glm5.3-flash.py (ships in the merged image tree)\nmodel_arch: glm5.3-flash\n# NOTE: /mnt/models-ro is a separate curated EFS volume (NFS), NOT a view of\n# fast scratch \u2014 the fetched model lives only on fast scratch, so both model\n# paths read the mountpoint-S3 fast-scratch mount directly.\nhf_checkpoint: /mnt/scratch-fast-1a-rw/durable/model-artifacts/external/zai-org/GLM-5.3-Flash-BF16\n# ref_load lives on EFS (scratch-s3files-rw), not fast scratch: the PP8\n# conversion produces 83 GB .distcp shards and mountpoint-S3 caps objects\n# at ~78 GiB (part-size x 10k parts) \u2014 cp fails with EFBIG. EFS has no\n# such cap and is the proven ref_load home (smoke + bowenxie qwen DCP).\nref_load: /mnt/scratch-s3files-rw/guparpit/checkpoints/dcp/glm5.3-flash_torch_dist\n# r11: 20 -> 5. r10 lost 3 steps x ~3 h to a node fabric fault with no\n# checkpoint between them; a step is ~3 h, so 5 bounds the loss to ~15 h.\nsave_interval: 5\nno_load_optim: true\nno_save_optim: true\nrollout_function_path: miles_plugins.arena.nats_arena.nats_rollout.generate_rollout\ndata_source_path: miles_plugins.arena.nats_arena.data_source.ArenaDataSourceWithBuffer\n# Dataset: the KNOWN_GYMS registry pin for snorkel-general-bash-harbor\n# (2922 validated tasks, manifest commit b4aeedec\u2026), curriculum-ordered by\n# GPT-5.6 solve rate (r17). r19: rows 1001..2922 only (1922 prompts;\n# `tail -n +1001` of the r17 manifest, md5 36ce6d409a002b7efb4c25b6983ec08e).\n# r18 consumed 31 steps x 64 = 1984 prompts of the easiest-first order; r19\n# skips the easiest 1000 rows instead of replaying them.\nprompt-data-list: '[{\"path\":\"/mnt/scratch-s3files-rw/guparpit/data/snorkel-general-bash-harbor/ecr-20260823-curriculum-gpt56-skip1000/manifest.jsonl\",\"gym_name\":\"snorkel-general-bash-harbor\",\"weight\":1.0}]'\nsglang_disable_overlap_schedule: true\n# sglang router binds on replica-index 0, where the rl-glm53f-sglang Service\n# points (smoke-proven pattern)\npin_rollout_manager_to_head: true\ninput_key: messages\nmetadata_key: metadata\napply_chat_template: false\n# loss_mask_type is INTENTIONALLY OMITTED \u2014 but note: unset does NOT mean\n# pass-through. The parser default is 'qwen' (miles/utils/arguments.py,\n# choices qwen/qwen3/qwen3_5/distill_qwen \u2014 no GLM type exists), and\n# nats_rollout.py feeds it into MultiTurnLossMaskGenerator whenever the\n# tokenizer fallback fires (any trajectory whose last step lacks\n# has_generate_tokens: messages-only / openai-client / old-gym trajectories).\n# What actually makes the omission safe HERE is `use_rollout_logprobs: true`\n# (below): every fallback sample gets zero-filled rollout_log_probs + status\n# ABORTED + remove_sample=True (nats_rollout.py), so it contributes zero\n# gradient, and a get_loss_mask exception is caught and padded at the group\n# converter. use_rollout_logprobs is therefore LOAD-BEARING for this\n# omission \u2014 do NOT disable it (or copy this yaml without it) unless a GLM\n# mask type is added first: the qwen heuristic silently produces masks on\n# GLM's template with zero warning.\n# r17: curriculum order (easiest first by GPT-5.6 solve rate); the manifest\n# below is pre-sorted, so no shuffle. The data source walks it in order.\nrollout_shuffle: false\nrollout_skip_special_tokens: true\n# r6: ~10 passes over the 2922-task list. Dynamic sampling publishes ~3.5x\n# the kept groups (r5: 111-127 published per 32 kept), so at batch 64 each\n# rollout draws ~224 prompts -> ~13 rollouts per pass -> 130 for 10 passes.\n# Batch 32 -> 64 also lifts the publisher's in-flight cap (2x batch) from 64\n# to 128 groups so the 16 engines see ~64 requests each instead of ~130.\nnum_rollout: 130\nrollout_batch_size: 64\nn_samples_per_prompt: 8\n# 2026-09-02 user-directed, with the gym's ARENA_MAX_TOKENS=32768 /\n# ARENA_ROLLOUT_CONTEXT_LIMIT=131072 (was 2048/32768, r5 parity): GLM at\n# reasoning=max truncated every first-rollout episode. Long-sample watch\n# items: samples up to ~131k tokens overflow the 8192 max_tokens_per_gpu\n# microbatch budget alone (allowed, memory headroom absorbs it) and fatten\n# NATS result messages toward the 8 MiB max_payload.\n# r11: back to 32768 (r9). r10 tried 8192 to shorten turns; keep the gym's\n# ARENA_MAX_TOKENS in lockstep (gym-worker.yaml).\nrollout_max_response_len: 32768\nrollout_temperature: 1\nglobal_batch_size: 512\nbalance_data: true\n# ---- sglang block: upstream GLM-5.3-Flash recipe (PR #2786) ----\n# 4 engines at 8 GPUs each (vs the parent's 8 engines at 4 GPUs): GLM needs a\n# full node per engine (bf16 weights ~643 GB -> ~80 GB/GPU at TP8).\nrollout_num_gpus_per_engine: 8\n# DERIVED, kept only for recipe parity: miles/backends/sglang_utils/\n# arguments.py unconditionally overwrites sglang_tp_size with\n# rollout_num_gpus_per_engine \u2014 editing this key alone is silently ignored.\nsglang_tp_size: 8\nsglang_ep_size: 8\nsglang_dp_size: 1\nrollout_max_context_len: 131072\nsglang_context_length: 131072\nsglang_chunked_prefill_size: 8192\nsglang_disable_radix_cache: true\n# tilelang/tilelang is effectively forced: the model config's index_kpool=4\n# restricts DSA backends to fa3/tilelang/trtllm, and on B200 with bf16 KV\n# tilelang is the only validated prefill backend besides trtllm.\nsglang_dsa_prefill_backend: tilelang\nsglang_dsa_decode_backend: tilelang\n# REQUIRED, not cosmetic: on SM100 (B200) the DSA family auto-defaults\n# kv-cache dtype to fp8_e4m3, and sglang's tilelang+fp8 check then raises\n# ValueError. Do not \"simplify\" by removing this key.\nsglang_kv_cache_dtype: bfloat16\nsglang_mem_fraction_static: 0.7\nsglang_router_port: 30000\n# router health knobs from the GLM recipe: DSA engine startup is slow, give\n# the router 40 x 15 s before declaring an engine dead\nrouter_health_success_threshold: 1\nrouter_health_check_interval_secs: 15\nrouter_health_failure_threshold: 40\nupdate_weights_interval: 1\n# intentionally inert on the arena NATS path (no consumer reads it for a\n# custom rollout function); kept for config parity with the parent\npartial_rollout: true\ngym_autoscale: false\nskip_eval_before_train: true\ndistributed_timeout_minutes: 60\nrollout_health_check_interval: 300\n# 900 (was 300): with use_fault_tolerance ON the monitor's health probe competes\n# with ~100 running + ~30 queued 30k-token requests per engine (KV usage 0.97 in\n# run 2); a 300 s timeout risks killing a HEALTHY engine and dropping its in-flight\n# trajectories. 900 s still detects a truly dead engine within one rollout.\nrollout_health_check_timeout: 900\n# Without this the two health knobs above are INERT (rollout_manager.py:115-123)\n# and one dead engine kills the run: run 2 served 32 min on 3 engines and then\n# died at 01:05:44 when update_weights called the dead actor (log 47802-47827;\n# SGLangEngine actors have no max_restarts). With FT the RolloutHealthMonitor\n# stops the dead engine and recover_updatable_engines rebuilds it at the next\n# update_weights (rollout_manager.py:343-354, server_group.py:215-245;\n# ft_components defaults to [rollout]). UNVALIDATED on the arena NATS path:\n# kill one engine's sglang in the 5-node smoke first; a 300 s health_generate\n# under 100-deep queues could false-kill a healthy engine (then raise\n# rollout_health_check_timeout to 600).\nuse_fault_tolerance: true\n# ---- parallelism: upstream GLM recipe, shape (8,4) scaled to 64 GPUs ----\n# TP8+SP x PP4 x CP1 = 32 GPUs per replica-group, DP=2 on 64 actor GPUs.\n# 45 layers split 11/(11/11)/12 across the 4 pipeline stages (MTP layer 45 is\n# dropped for training).\ntensor_model_parallel_size: 8\nsequence_parallel: true\npipeline_model_parallel_size: 4\ndecoder_first_pipeline_num_layers: 11\ndecoder_last_pipeline_num_layers: 12\ncontext_parallel_size: 1\nexpert_model_parallel_size: 16\nexpert_tensor_parallel_size: 1\n# ---- perf block: upstream GLM recipe ----\nrecompute_granularity: full\nrecompute_method: uniform\nrecompute_num_layers: 1\n# Reconciliation with the parent's dynamic-batch mechanism: the parent ran\n# use_dynamic_batch_size + max_tokens_per_gpu 65536; the GLM recipe ran plain\n# micro_batch_size 1 + max_tokens_per_gpu 8192. Recipe values win for the\n# model-bound token budget (8192 \u2014 321B at full recompute cannot take 65536);\n# dynamic batching (the arena packing mechanism) is kept, and micro_batch_size\n# 1 is the recipe-faithful fallback (ignored while dynamic batching is on).\nmicro_batch_size: 1\nuse_dynamic_batch_size: true\nmax_tokens_per_gpu: 8192\n# Pads each thd micro-batch token stream to a multiple of TP*512 = 4096 tokens\n# (default 128 -> 1024; miles/backends/training_utils/data.py:228-232).\n# tilelang_sparse_mla_bwd takes S/S_kv as static ints while the fwd uses\n# T.dynamic, so the DSA backward triplet re-JITs for every distinct padded\n# length (~3300 compile events across 64 ranks in run 2, ~12 s each, stalling\n# all PP stages); 4096-token granularity cuts distinct lengths ~37 -> ~10 for\n# ~+6.5% pad tokens. Pad tokens form their own cu_seqlens segment -- verify\n# loss parity in the smoke.\ndata_pad_size_multiplier: 512\n# ---- misc: upstream GLM recipe ----\nattention_dropout: 0.0\nhidden_dropout: 0.0\naccumulate_allreduce_grads_in_fp32: true\nattention_softmax_in_fp32: true\nupdate_weight_buffer_size: 1073741824\ntrain_memory_margin_bytes: 3221225472\nqkv_format: thd\n# selects the megatron<->sglang weight mapping (miles_plugins.models.glm5_next)\n# in the weight updater and the HF export path; the HF config class name alone\n# does not resolve it \u2014 the recipe passes this explicitly\nmodel_name: glm5_next\n# check_weight_update_equal is OFF. Its cost is NOT a per-update compare but a\n# permanent ~73 GiB anonymous CPU copy of every TP rank's parameter shard\n# (sglang weight_checker.py:114-121 `param.data.detach().cpu()`, issued once at\n# startup by miles/ray/placement_group.py:213-217 and never released): 8 ranks x\n# ~79 GiB = ~632 GiB of the 1934 GiB Ray counted on the engine node at the\n# run-2 OOM kill (/tmp/glm53-run2-t0.log:47868-47876). Step-0 megatron->sglang\n# equality was already verified in run 2 (log 14798-14800). Re-enable only in a\n# single-engine smoke (false -> the launcher drops the flag; the skip list is\n# meaningless without it, so it is removed too).\ncheck_weight_update_equal: false\n# ---- algorithm/GRPO block: r15 = upstream GLM recipe\n# (examples/experimental/openenv/glm52_tbench2/run_glm5_2_744b_a40b_daytona.py\n# L200-210): eps 0.2/0.28 + TIS (tis-clip 2.0, low 0.0). Motivation: every\n# run r9-r14 shows train/ppo_kl ~0.008 and pg_clipfrac ~1.1% at step 0 (a\n# pure train/inference mismatch; miles ci_utils asserts <1e-8 on-policy) and\n# reward is flat. TIS reweights each token by clip(pi_train/pi_rollout, 0, 2)\n# using the SGLang logprobs the gym already ships. Only delta vs r13. ----\nadvantage_estimator: grpo\n# r15: use_rollout_logprobs OFF because arguments.py:3185 forbids it with\n# use_tis (TIS recomputes old_log_probs with the actor, one extra forward per\n# step, and uses rollout_log_probs only as the IS denominator). The r13\n# loss_mask_type safety net above relied on it: slow-path (messages-only)\n# samples are zero-filled+removed only under use_rollout_logprobs. Verified\n# 0 slow-path samples in r13 (123 steps) and r14 (120 steps): the Vulcan gym\n# always ships has_generate_tokens. Fast-path bad-logprob samples are still\n# zero-filled and ABORTED unconditionally (nats_rollout.py ~L495).\n# r18: back to false; the r17 rollout-logprob path put ppo_kl at 0.0062.\nuse_rollout_logprobs: false\n# r17: TIS off. r16 (R3) logged train/tis 1.000 and tis_clipfrac 0.1%, so\n# TIS corrects nothing and its old-logprob pass cost 5 min per step.\n# r18: TIS on again. The old-logprob pass it forces is what kept r16 on-policy\n# (ppo_kl 1.8e-5); r17 without it drifted to 0.0062 by step 15.\nuse_tis: true\ntis_clip: 2.0\n# r16: R3 rollout routing replay (arXiv 2510.11370; miles arena ADR-0012).\n# r9-r15 all show train/ppo_kl ~0.008 and pg_clipfrac ~1.1% at step 0 with a\n# flat reward. For a MoE the dominant train/inference mismatch is route flips:\n# SGLang and Megatron pick different top-k experts for the same token. R3\n# replays the SGLang routing in the actor forward and backward, so that term\n# goes to zero; TIS stays on to cover the residual (DSA indexer top-k is not\n# replayed: 3.6 GB per episode, ADR-0012 decision 1). Sets SGLang\n# enable_return_routed_experts on the engines and capture_routed_experts on\n# every NATS task message. The gym writes one int32 blob per segment\n# (~1.4 KB per token, ~58 MB per 40k-token episode) under ARENA_ROUTING_DIR\n# and ships a {path,bytes,sha256} pointer; the trainer decodes at batch\n# drain time and deletes the file. Under R3 train/kl_loss is not a valid\n# on-policy check (the ref model runs without replay).\nuse_rollout_routing_replay: true\ntis_clip_low: 0.0\nkeep_old_actor: false\n# use_kl_loss/kl_loss_type DROPPED (was r5-parity): with kl_loss_coef 0.0 the\n# gradient is identical, but use_kl_loss forced with_ref=True -> ref checkpoint\n# load, a second pinned bf16 CPU backup per actor rank, and a full ref forward\n# over the whole GBS every step = 2388 s of the 7722 s train step 0 (log 47796,\n# 31% of the step). Upstream run_glm5_3_flash.py runs no ref pass. Only the\n# train/kl_loss diagnostic is lost; kl coefs stay pinned at 0.0 explicitly.\nkl_coef: 0.0\nkl_loss_coef: 0.0\nentropy_coef: 0.0\neps_clip: 0.2\neps_clip_high: 0.28\neps_clip_c: 2.0\n# ---- optimizer: upstream GLM recipe (lr 15e-7 -> 1e-6) ----\noptimizer: adam\nlr: 1e-6\nlr_decay_style: constant\nweight_decay: 0.1\nadam_beta1: 0.9\nadam_beta2: 0.98\nuse_distributed_optimizer: true\n# ---- optimizer CPU offload (added after r3, 2026-09-03) ----\n# r3 train step 0 fit (peak ~109 GB allocated/rank after the step) but step 1\n# CUDA-OOMed in the fla KDA backward on a ~37k-token sample (\"177 GiB in use,\n# 144 GiB allocated, 1 GiB free\"): step 1 carries the Adam states (fp32 master +\n# m + v, ~33 GB/rank even sharded over DP=2) that did not exist during step 0,\n# and the KDA layers run all 64 heads on every TP rank, so long-sequence\n# backward transients are large. Offloading the optimizer to CPU frees that\n# headroom; this is the trio every upstream large-MoE recipe in miles uses\n# (scripts/run_deepseek_v32.py, amd/run_glm5_2_744b_a40b.py). Megatron requires\n# precision-aware with cpu-offload; miles asserts the reverse implication too.\n# Host cost: ~66 GB fp32 state per rank -> ~530 GB per actor node (fits the\n# 1800Gi limit; engines nodes unaffected).\noptimizer_cpu_offload: true\noverlap_cpu_optimizer_d2h_h2d: true\nuse_precision_aware_optimizer: true\n# ---- tracking ----\nuse_tensorboard: false\nuse_wandb: true\nuse_distributed_post: true\n# enable_trajectory_tracing REMOVED (parent carried `false`): NO miles flag\n# with that name is registered anywhere \u2014 it is a deploy.sh-era AGISlime env\n# key. `false` was inert (the converter drops false booleans) but flipping it\n# to true would emit an unknown flag and kill the trainer at argparse.\narena_sample_mode: full_trajectory\n# REQUIRES image miles-glm53-20260902c: the flag (nats_rollout.py:1827) was\n# committed 2026-09-02 23:44 UTC, AFTER image b was built -- on image b the\n# strict argparse kills the trainer at startup. Run 2: truncated_ratio 0.898,\n# ess_ratio 0.099 (log 31133, 47792): ~90% of samples carried no loss because\n# a clipped final turn removed the whole sample (r5-lineage policy). Now only\n# the clipped final turn's loss-mask is zeroed and earlier turns stay\n# trainable (nats_rollout.py:447-470); degenerate stops, hard overflows and\n# zero-filled logprobs keep the removal behaviour. Watch\n# train_rollout_logprob_abs_diff and rollout/truncated_ratio (status stays\n# TRUNCATED, so the metric remains honest).\narena_mask_clipped_final_turn: true\n# r5 (REQUIRES image miles-glm53-20260903d): keep Harbor wall-clock-timeout\n# trajectories. r4 removed 222-245/256 samples per step as agent timeouts\n# although every recorded turn ended cleanly and the verifier ran -- e.g.\n# rollout 9 had 51 reward-1 samples but only 29 survived removal. Kept\n# samples stay status TRUNCATED (truncated_ratio stays honest) and are\n# reported as kept_timeout=N in 'Removal reasons'.\narena_keep_timeout_trajectories: true\n# r8 (REQUIRES image miles-glm53-20260905a + gym image glm53-ctxend-20260905a):\n# the gym now ENDS an episode whose next prompt would overflow the engine\n# context (agent_stop_reason=context_error) and still grades it. Keep those\n# samples exactly like kept timeouts: loss_mask untouched, status TRUNCATED\n# (truncated_ratio stays honest), reported as kept_context_error=N.\narena_keep_context_error_trajectories: true\n# r11 (REQUIRES an image built from the arena-inflight-multiplier commit; on\n# older images the strict argparse kills the trainer at startup): publisher\n# in-flight cap = 4 x rollout_batch_size = 256 groups (nats_rollout.py\n# _publisher_max_in_flight). r10 on 32 engines with the default 2x (128\n# groups) sat at KV ~0.83 with an empty queue; 4x keeps the engines fed.\n# Size the gym Deployment replicas above this cap (gym-worker.yaml: 288).\narena_inflight_multiplier: 4\n# r19 (REQUIRES image miles-glm53-r3-20260911b, arpit-glm-53 09f477834): from\n# epoch 1 on, skip prompts whose last mean raw reward exceeded 0.5.\narena_skip_prompt_above_reward: 0.5\n# r12 (REQUIRES image miles-glm53-20260908a, arpit-glm-53 d28503cf; on an\n# older image the strict argparse kills the trainer at startup on this key):\n# train every segment of an episode (miles arena ADR-0011). The Vulcan gym\n# (AREnATasks ADR-0048) starts a new rollout segment at each context\n# compaction and ships one step per segment. `final` (the default) trains the\n# last segment only. `all` trains every segment as its own Sample with a\n# shared rollout_id and the episode reward. global_batch_size still counts\n# episodes (512); the row count per step is data dependent, so the trainer\n# pads it with zero-loss sibling rows to a multiple of the DP alignment (DP=2\n# here: 64 actor GPUs / (TP8 x PP4)) because build_dp_schedule cannot split\n# a singleton micro-batch. Read rollout/num_training_samples (rows per step)\n# and rollout/episode_raw_reward (one value per episode, not per row). The\n# interim rollout/compaction_segments_mean (34db7fc6, never in a run image)\n# is gone.\narena_train_segments: all\nlog_passrate: false\nwandb_host: https://mega.wandb.agi.amazon.dev\nwandb_project: rl-snorkel27\nwandb_team: arena\nwandb_always_use_train_step: false\n# wandb group = EXPERIMENT_NAME (rl-glm53f-gbash-r1), appended by the launcher\n# Zero-variance groups carry no GRPO gradient; drop them and fetch extras\n# (examine cap 4x target via --dynamic-sampling-max-examine-mult default).\ndynamic_sampling_filter_path: miles.rollout.filter_hub.dynamic_sampling_filters.check_reward_nonzero_std\n"
